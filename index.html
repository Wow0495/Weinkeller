/** Lagerplan: ein Regal als Raster Reihe × Fach */
function viewPlan() {
  const s = Store.state;
  const zones = s.locations.flatMap(l => l.zones.map(z => ({ l, z })));
  if (!zones.length) return '<p>Noch keine Lagerorte. <a href="#/daten">Lagerorte anlegen</a></p>';
  if (!UI.planZone || !zones.find(x => `${x.l.id}|${x.z.id}` === UI.planZone)) UI.planZone = `${zones[0].l.id}|${zones[0].z.id}`;
  const [locId, zoneId] = UI.planZone.split('|');
  const { l, z } = zones.find(x => x.l.id === locId && x.z.id === zoneId);
  const { cells, loose } = zoneOccupancy(s, locId, zoneId);
  let free = 0;
  let g = `<div class="plan ${z.cols <= 10 ? 'fluid' : ''}" style="grid-template-columns: 2rem repeat(${z.cols}, ${z.cols <= 10 ? 'minmax(28px, 56px)' : '46px'})" role="group" aria-label="Lagerplan ${esc(l.name)} ${esc(z.name)}">`;
  g += `<span class="hdr" aria-hidden="true"></span>` + Array.from({ length: z.cols }, (_, c) => `<span class="hdr" aria-hidden="true">F${c + 1}</span>`).join('');
  for (let r = 1; r <= z.rows; r++) {
    g += `<span class="rh" aria-hidden="true">R${r}</span>`;
    for (let c = 1; c <= z.cols; c++) {
      const items = cells[`${r}-${c}`];
      if (!items) {
        free++;
        g += `<button class="cell" data-act="cell-free" data-r="${r}" data-c="${c}" aria-label="Reihe ${r}, Fach ${c}: frei. Hier neuen Wein einlagern">·</button>`;
      } else {
        const n = items.reduce((a, x) => a + x.p.count, 0);
        const worst = items.map(x => maturity(x.w)).sort((a, b) => b.score - a.score)[0];
        const names = items.map(x => `${x.w.name} ${UI.vintage(x.w)} (${x.p.count})`).join(', ');
        g += `<button class="cell occ s-${worst.key} ${items.length > 1 ? 'multi' : ''}" data-act="cell" data-r="${r}" data-c="${c}" title="${esc(names)}" aria-label="Reihe ${r}, Fach ${c}: ${esc(names)} – ${esc(worst.label)}">${n}</button>`;
      }
    }
  }
  g += '</div>';
  return `<div class="row"><label for="plan-zone" style="margin:0">Regal</label><select id="plan-zone" style="flex:1;min-width:12rem">${UI.zoneOptions(locId, zoneId)}</select></div>
    <p class="small muted">${z.rows} Reihen × ${z.cols} Fächer · <strong>${free}</strong> freie Fächer. Belegtes Fach antippen = Wein öffnen, freies Fach = dort einlagern.</p>
    <div class="plan-wrap">${g}</div>
    <div class="legend small" aria-label="Legende">${['lagern', 'trinkreif', 'bald', 'ueberfaellig'].map(k => `<span class="badge st-${k}">${STATUS[k].label}</span>`).join('')}</div>
    ${loose.length ? `<p class="small" style="margin-bottom:0">Ohne Fachangabe in ${esc(z.name)}: ${loose.map(x => `<a href="#/wein/${x.w.id}">${esc(x.w.name)} ${esc(UI.vintage(x.w))}</a> (${x.p.count})`).join(', ')}</p>` : ''}`;
}

/** Liest das Formular in ein Wein-Objekt */
function readForm(form, base) {
  const fd = new FormData(form), g = k => (fd.get(k) ?? '').toString().trim();
  const w = Object.assign(deepClone(base), {
    name: g('name'), producer: g('producer'), type: g('type'),
    vintage: form.nv.checked ? 'NV' : toInt(g('vintage')),
    drinkFrom: toInt(g('drinkFrom')), peak: toInt(g('peak')), drinkUntil: toInt(g('drinkUntil')),
    grapes: splitList(g('grapes')), country: g('country'), region: g('region'), appellation: g('appellation'), classification: g('classification'),
    bottleSize: toNum(g('bottleSize')), abv: toNum(g('abv')), purchaseDate: g('purchaseDate'), price: toNum(g('price')), source: g('source'),
    food: g('food'), servingTemp: g('servingTemp'), decant: g('decant'), externalRatings: g('externalRatings'),
    tags: splitList(g('tags')), notes: g('notes'), rating: UI.formWine.rating, photo: UI.formWine.photo,
    placements: UI.formWine.placements.map(p => ({ ...p })), updatedAt: new Date().toISOString(),
    origin: form.querySelector('[name=origin]:checked')?.value || base.origin,
    externalPlace: g('externalPlace'), vivinoRating: toNum(g('vivinoRating')), vivinoUrl: g('vivinoUrl'),
    wishlist: [...form.querySelectorAll('[name=wishlist]')].some(c => c.checked && !c.closest('.hidden'))
  });
  return w;
}

function showErrors(form, errors) {
  $$('[aria-invalid]', form).forEach(el => { el.removeAttribute('aria-invalid'); el.removeAttribute('aria-describedby'); });
  $$('.field-error', form).forEach(el => el.remove());
  const map = { name: 'w-name', producer: 'w-producer', vintage: 'w-vintage', type: 'w-type', drinkFrom: 'w-from', peak: 'w-peak', drinkUntil: 'w-until', price: 'w-price', abv: 'w-abv', qty: 'w-qty', quantity: 'w-qty', purchaseDate: 'w-pdate', vivinoRating: 'w-vivino', vivinoUrl: 'w-vivurl', externalPlace: 'w-place' };
  const msgs = Object.entries(errors);
  $('#form-errors').innerHTML = msgs.length ? `<div class="errors" role="alert" tabindex="-1"><strong>Bitte korrigieren:</strong><ul>${msgs.map(([, m]) => `<li>${esc(m)}</li>`).join('')}</ul></div>` : '';
  for (const [k, m] of msgs) {
    let el = map[k] && document.getElementById(map[k]);
    if (!el && k.startsWith('placement')) el = document.getElementById(`pl-n-${k.replace('placement', '').replace('s', '0')}`) || $('#placements select');
    if (el) {
      el.setAttribute('aria-invalid', 'true');
      const d = document.createElement('div'); d.className = 'field-error'; d.id = 'err-' + k; d.textContent = m;
      el.setAttribute('aria-describedby', d.id); el.insertAdjacentElement('afterend', d);
      if (el.closest('details')) el.closest('details').open = true;
    }
  }
  if (msgs.length) $('#form-errors .errors').focus();
}

async function submitForm(form, mode) {
  const base = UI.formWine;
  const w = readForm(form, base);
  const errors = {};
  if (w.origin === 'extern') {
    w.placements = []; w.movements = [];
    if (mode !== 'edit') {
      w.createdAt = new Date().toISOString(); w.purchaseDate = '';
      const note = (form.tastedNote?.value || '').trim(), date = form.tastedDate?.value || todayISO();
      w.tastings = [...(w.tastings || [])];
      if (note || w.rating) w.tastings.push({ id: uuid(), date, text: note || '(ohne Notiz)', rating: w.rating });
    }
  } else if (mode !== 'edit') {
    // Neuer Wein: Menge als Zugang buchen
    const qty = toInt(form.qty.value);
    if (qty == null || Number.isNaN(qty) || qty < 0) errors.qty = 'Die Menge muss eine ganze Zahl ab 0 sein.';
    else {
      w.movements = qty > 0 ? [{ id: uuid(), date: w.purchaseDate || todayISO(), kind: 'kauf', qty, note: 'Ersterfassung' }] : [];
      if (mode !== 'adopt') w.createdAt = new Date().toISOString();
    }
  }
  for (const [i, p] of w.placements.entries()) {
    if (Number.isNaN(p.row) || Number.isNaN(p.col) || Number.isNaN(p.count)) errors['placement' + i] = `Lagerplatz ${i + 1}: Reihe, Fach und Anzahl müssen ganze Zahlen sein.`;
  }
  w.placements = w.placements.filter(p => p.count > 0 || mode === 'edit');
  const res = validateWine(w, Store.state);
  Object.assign(errors, res.errors);
  if (Object.keys(errors).length) return showErrors(form, errors);
  const ok = await Store.commit(s => {
    const i = s.wines.findIndex(x => x.id === w.id);
    if (i >= 0) s.wines[i] = w; else s.wines.push(w);
  });
  if (!ok) return;
  UI.toast(mode === 'edit' ? 'Änderungen gespeichert.' : mode === 'adopt' ? `„${w.name}“ liegt jetzt in deinem Keller.` : w.origin === 'extern' ? `„${w.name}“ gemerkt.` : `„${w.name}“ angelegt.`);
  location.hash = '#/wein/' + w.id;
}

/** Foto verkleinern (max. 1000 px, JPEG) damit der Speicher nicht vollläuft */
function resizeImage(file) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const max = 1000, sc = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.75));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Bild konnte nicht gelesen werden.')); };
    img.src = url;
  });
}

function route() {
  const h = location.hash.replace(/^#\/?/, '') || 'uebersicht';
  const [path, qs] = h.split('?');
  const [name, id] = path.split('/');
  return { name, id, query: Object.fromEntries(new URLSearchParams(qs || '')) };
}

function render() {
  const r = route(), m = main();
  const keepScroll = render.lastRoute === location.hash ? window.scrollY : 0;
  let html;
  switch (r.name) {
    case 'keller': html = viewCellar(); break;
    case 'neu': html = viewForm('new', null, r.query); break;
    case 'bearbeiten': html = viewForm('edit', r.id, r.query); break;
    case 'duplizieren': html = viewForm('dup', r.id, r.query); break;
    case 'einlagern': html = viewForm('adopt', r.id, r.query); break;
    case 'wein': html = viewDetail(r.id); break;
    case 'daten': html = viewData(); break;
    case 'lagerplan': html = viewPlanPage(); break;
    default: html = viewOverview(); r.name = 'uebersicht';
  }
  m.innerHTML = html;
  $$('nav.tabs a').forEach(a => a.toggleAttribute('aria-current', false));
  const nav = { uebersicht: 'uebersicht', keller: 'keller', wein: 'keller', neu: 'neu', bearbeiten: 'keller', duplizieren: 'neu', einlagern: 'keller', lagerplan: 'keller' }[r.name];
  // Kopfzeile: auf der Übersicht Monat/Jahr, sonst Markenname
  const crumb = $('#crumb'); crumb.textContent = r.name === 'uebersicht' ? monthYear() : 'Mein Weinkeller'; crumb.classList.toggle('brand', r.name !== 'uebersicht');
  $('#side-date').textContent = monthYear();
  const lb = Store.state.meta.lastBackupAt; $('#side-backup').textContent = lb ? `Letztes Backup: ${fmtDate(lb)}` : 'Noch kein Backup';
  if (nav) $(`nav.tabs a[data-nav="${nav}"]`).setAttribute('aria-current', 'page');
  document.title = { uebersicht: 'Übersicht', keller: 'Keller', neu: 'Neuer Wein', wein: 'Wein', bearbeiten: 'Bearbeiten', duplizieren: 'Duplizieren', einlagern: 'In den Keller übernehmen', daten: 'Daten & Backup', lagerplan: 'Lagerplan' }[r.name] + ' · Weinkeller';
  if (r.name === 'keller') renderResults();
  if (['neu', 'bearbeiten', 'duplizieren', 'einlagern'].includes(r.name)) bindForm({ bearbeiten: 'edit', duplizieren: 'dup', einlagern: 'adopt', neu: 'new' }[r.name]);
  if (render.lastRoute !== location.hash) { window.scrollTo(0, 0); const af = $('[autofocus]', m); if (af && matchMedia('(min-width: 700px)').matches) af.focus(); else m.focus({ preventScroll: true }); }
  else window.scrollTo(0, keepScroll);
  render.lastRoute = location.hash;
}

/* ---------- Formular-Verhalten ---------- */
function bindForm(mode) {
  const form = $('#wine-form'); if (!form) return;
  const w = UI.formWine;
  const updEst = () => {
    const tmp = readForm(form, w);
    const e = estimateWindow(tmp);
    ['w-from', 'w-peak', 'w-until'].forEach((id, i) => { $('#' + id).placeholder = [e.drinkFrom, e.peak ?? '', e.drinkUntil][i]; });
    const has = tmp.drinkFrom != null || tmp.drinkUntil != null;
    $('#est-hint').innerHTML = has ? 'Eigene Angaben haben Vorrang. Fehlende Werte werden geschätzt.' :
      `Ohne Angabe nutzt die App eine <strong>Schätzung</strong>: ${e.drinkFrom}–${e.drinkUntil}${e.peak ? `, Höhepunkt ${e.peak}` : ''} (${esc(e.basis.slice(-1)[0] || '')}). <button type="button" class="sm" data-act="est-fill">Übernehmen</button>`;
  };
  form.addEventListener('input', e => {
    const t = e.target;
    if (t.name === 'nv') { form.vintage.disabled = t.checked; if (t.checked) form.vintage.value = ''; }
    if (t.name === 'origin') $$('[data-show]', form).forEach(el => el.classList.toggle('hidden', el.dataset.show !== t.value));
    if (t.name === 'wishlist') $$('[name=wishlist]', form).forEach(c => { c.checked = t.checked; });
    if (['name', 'producer', 'vintage', 'nv'].includes(t.name)) $('#vivino-search').href = vivinoSearchUrl(readForm(form, w));
    if (t.dataset.pl) {
      const p = w.placements[+t.dataset.i];
      if (t.dataset.pl === 'zone') { const [l, z] = t.value.split('|'); p.locationId = l; p.zoneId = z; }
      else { p[t.dataset.pl] = toInt(t.value); if (t.dataset.pl === 'count') p._touched = true; }
    }
    // Neue Weine: Menge → Anzahl im ersten Lagerplatz übernehmen, solange nicht selbst geändert
    if (t.name === 'qty' && w.placements.length === 1 && !w.placements[0]._touched) {
      const n = toInt(t.value); w.placements[0].count = Number.isInteger(n) ? n : 0; $('#pl-n-0').value = t.value;
    }
    if (['vintage', 'type', 'nv', 'grapes', 'classification', 'bottleSize', 'drinkFrom', 'drinkUntil', 'peak', 'purchaseDate', 'name', 'appellation'].includes(t.name)) updEst();
  });
  form.addEventListener('submit', e => { e.preventDefault(); w.placements.forEach(p => delete p._touched); submitForm(form, mode); });
  form.addEventListener('click', async e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const act = b.dataset.act;
    if (act === 'star') { w.rating = +b.dataset.n || null; $$('.star-input [data-n]', form).forEach(x => x.dataset.n !== '0' && x.setAttribute('aria-pressed', String((w.rating || 0) >= +x.dataset.n))); }
    if (act === 'pl-add') { const last = w.placements.at(-1), l = Store.state.locations[0]; w.placements.push({ id: uuid(), locationId: last ? last.locationId : l.id, zoneId: last ? last.zoneId : l.zones[0].id, row: null, col: null, count: 1, _touched: true }); $('#placements').innerHTML = '<legend>Lagerort</legend>' + placementsEditor(w, mode !== 'edit'); }
    if (act === 'pl-del') { w.placements.splice(+b.dataset.i, 1); $('#placements').innerHTML = '<legend>Lagerort</legend>' + placementsEditor(w, mode !== 'edit'); }
    if (act === 'photo-del') { w.photo = null; $('#photo-prev').innerHTML = ''; }
    if (act === 'est-fill') { const e2 = estimateWindow(readForm(form, w)); form.drinkFrom.value = e2.drinkFrom; form.peak.value = e2.peak ?? ''; form.drinkUntil.value = e2.drinkUntil; updEst(); }
  });
  $('#w-photo').addEventListener('change', async e => {
    const f = e.target.files[0]; if (!f) return;
    try { w.photo = await resizeImage(f); $('#photo-prev').innerHTML = `<img class="photo" src="${w.photo}" alt="Etikett"><button type="button" class="sm danger" data-act="photo-del">Foto entfernen</button>`; }
    catch (err) { UI.toast(err.message); }
  });
  updEst();
}

/* ---------- Globale Klick-Aktionen (Event-Delegation) ---------- */
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b || b.closest('#wine-form')) return;
  const act = b.dataset.act, s = Store.state, r = route();
  switch (act) {
    case 'quick': return UI.quickWithdraw(b.dataset.id);
    case 'backup': {
      const d = new Date(), stamp = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      await Store.commit(st => { st.meta.lastBackupAt = new Date().toISOString(); });
      UI.download(`weinkeller-backup-${stamp}.json`, exportJSON(Store.state), 'application/json');
      UI.toast('Backup erstellt. Lege die Datei an einem sicheren Ort ab.'); return render();
    }
    case 'csv': UI.download(`weinkeller-${todayISO()}.csv`, exportCSV(s), 'text/csv;charset=utf-8'); return UI.toast('CSV exportiert.');
    case 'demo': {
      if (s.wines.some(w => w.isDemo)) return UI.toast('Beispielweine sind schon geladen.');
      await Store.commit(st => { st.wines.push(...buildDemo(st)); }); UI.toast(`${Store.state.wines.filter(w => w.isDemo).length} Beispielweine geladen.`); return render();
    }
    case 'demo-del': {
      const n = s.wines.filter(w => w.isDemo).length;
      if (!(await UI.confirm('Beispielweine löschen?', `${n} Beispielweine werden entfernt. Deine eigenen Weine bleiben.`, 'Löschen', true))) return;
      await Store.commit(st => { st.wines = st.wines.filter(w => !w.isDemo); }); UI.toast('Beispielweine gelöscht.'); return render();
    }
    case 'wipe': {
      if (!(await UI.confirm('Wirklich ALLES löschen?', 'Alle Weine, Historie und Lagerorte werden gelöscht. Das lässt sich nur mit einem Backup rückgängig machen.', 'Alles löschen', true))) return;
      await Store.commit(st => { const fresh = emptyState(); Object.keys(st).forEach(k => delete st[k]); Object.assign(st, fresh); });
      Marker.set(0); UI.toast('Alle Daten gelöscht.'); location.hash = '#/uebersicht'; return render();
    }
    case 'toggle-filter': UI.filterOpen = !UI.filterOpen; $('#filters').classList.toggle('hidden', !UI.filterOpen); return b.setAttribute('aria-expanded', UI.filterOpen);
    case 'status': case 'type': {
      const arr = act === 'status' ? UI.filter.statuses : UI.filter.types, k = b.dataset.k, i = arr.indexOf(k);
      i >= 0 ? arr.splice(i, 1) : arr.push(k); b.setAttribute('aria-pressed', i < 0); return renderResults();
    }
    case 'reset-filter': UI.filter = { ...{ scope: 'bestand', q: '', types: [], statuses: [], country: '', region: '', grape: '', locationId: '', priceMin: '', priceMax: '', vintageMin: '', vintageMax: '', food: '', wishlist: false }, scope: UI.filter.scope }; return render();
    case 'scope': UI.filter.scope = b.dataset.scope; UI.filter.statuses = []; if (route().name === 'keller') { e.preventDefault(); render(); } return; // als Link: navigiert zu #/keller
    case 'cell': {
      const [locId, zoneId] = UI.planZone.split('|'), rr = +b.dataset.r, cc = +b.dataset.c;
      const hits = s.wines.filter(w => quantity(w) > 0 && w.placements.some(p => p.locationId === locId && p.zoneId === zoneId && p.row === rr && p.col === cc && p.count > 0));
      if (hits.length === 1) { location.hash = '#/wein/' + hits[0].id; return; }
      const id = await UI.dialog({ title: `Reihe ${rr}, Fach ${cc}`, html: '<p>Hier liegen mehrere Weine:</p>', buttons: [...hits.map(w => ({ label: `${w.name} ${UI.vintage(w)}`, value: w.id })), { label: 'Schließen', value: null }] });
      if (id) location.hash = '#/wein/' + id; return;
    }
    case 'cell-free': { const [loc, zone] = UI.planZone.split('|'); location.hash = `#/neu?loc=${loc}&zone=${zone}&r=${b.dataset.r}&c=${b.dataset.c}`; return; }
    case 'take-estimate': {
      await Store.commit(st => { const w = st.wines.find(x => x.id === b.dataset.id), e2 = estimateWindow(w);
        w.drinkFrom ??= e2.drinkFrom; w.drinkUntil ??= e2.drinkUntil; if (w.peak == null && e2.peak && e2.peak >= w.drinkFrom && e2.peak <= w.drinkUntil) w.peak = e2.peak; w.updatedAt = new Date().toISOString(); });
      UI.toast('Schätzung als Trinkfenster übernommen – du kannst sie jederzeit ändern.'); return render();
    }
    case 'plan-zone': UI.planZone = b.dataset.zone; return; // Link navigiert zu #/lagerplan
    case 'now-filter': UI.filter.scope = 'bestand'; UI.filter.statuses = ['ueberfaellig', 'bald']; return;
    case 'wish': {
      await Store.commit(st => { const x = st.wines.find(x => x.id === b.dataset.id); x.wishlist = !x.wishlist; x.updatedAt = new Date().toISOString(); });
      UI.toast(Store.wine(b.dataset.id).wishlist ? 'Auf die Nachkaufliste gesetzt.' : 'Von der Nachkaufliste genommen.'); return render();
    }
    case 'move-open': $('#move-form').classList.remove('hidden'); return $('#mv-kind').focus();
    case 'move-close': return $('#move-form').classList.add('hidden');
    case 'mv-del': {
      const w = Store.wine(r.id), mv = w.movements.find(m => m.id === b.dataset.mid);
      const after = quantity(w) - movementDelta(mv);
      if (after < 0) return UI.toast('Diese Buchung kann nicht gelöscht werden – der Bestand würde negativ.');
      if (!(await UI.confirm('Buchung löschen?', `${MOVEMENT_KINDS[mv.kind].label} vom ${fmtDate(mv.date)} (${movementDelta(mv) > 0 ? '+' : ''}${movementDelta(mv)}) wird entfernt. Lagerplätze bitte ggf. unter „Bearbeiten“ anpassen.`, 'Löschen', true))) return;
      await Store.commit(st => { const x = st.wines.find(x => x.id === r.id); x.movements = x.movements.filter(m => m.id !== mv.id);
        // Lagerplätze dürfen nicht mehr Flaschen zeigen als vorhanden
        let over = placedCount(x) - quantity(x); for (const p of [...x.placements].reverse()) { if (over <= 0) break; const n = Math.min(p.count, over); p.count -= n; over -= n; }
        x.updatedAt = new Date().toISOString(); });
      return render();
    }
    case 'tasting-del': {
      if (!(await UI.confirm('Notiz löschen?', 'Die Verkostungsnotiz wird entfernt.', 'Löschen', true))) return;
      await Store.commit(st => { const x = st.wines.find(x => x.id === r.id); x.tastings = x.tastings.filter(t => t.id !== b.dataset.tid); }); return render();
    }
    case 'delete': {
      const w = Store.wine(b.dataset.id);
      if (!(await UI.confirm('Wein endgültig löschen?', `„${w.name} ${UI.vintage(w)}“ samt Historie und Notizen wird gelöscht. Tipp: Ausgetrunkene Weine musst du nicht löschen – sie bleiben als Archiv.`, 'Endgültig löschen', true))) return;
      await Store.commit(st => { st.wines = st.wines.filter(x => x.id !== w.id); }); UI.toast('Wein gelöscht.'); location.hash = '#/keller'; return;
    }
    case 'loc-add': await Store.commit(st => st.locations.push({ id: uuid(), name: 'Neues Lager', zones: [{ id: uuid(), name: 'Regal 1', rows: 4, cols: 6 }] })); return render();
    case 'zone-add': await Store.commit(st => st.locations.find(l => l.id === b.dataset.loc).zones.push({ id: uuid(), name: 'Neues Regal', rows: 4, cols: 6 })); return render();
    case 'loc-del': case 'zone-del': {
      const [locId, zoneId] = (b.dataset.zone || b.dataset.loc).split('|');
      const used = s.wines.some(w => w.placements.some(p => p.count > 0 && p.locationId === locId && (!zoneId || p.zoneId === zoneId)));
      if (used) return UI.toast('Hier liegen noch Flaschen. Bitte zuerst umlagern.');
      if (act === 'loc-del' && s.locations.length <= 1) return UI.toast('Mindestens ein Lager wird benötigt.');
      if (act === 'zone-del' && s.locations.find(l => l.id === locId).zones.length <= 1) return UI.toast('Jedes Lager braucht mindestens ein Regal/Zone.');
      await Store.commit(st => {
        if (act === 'loc-del') st.locations = st.locations.filter(l => l.id !== locId);
        else { const l = st.locations.find(l => l.id === locId); l.zones = l.zones.filter(z => z.id !== zoneId); }
        st.wines.forEach(w => { w.placements = w.placements.filter(p => !(p.locationId === locId && (!zoneId || p.zoneId === zoneId))); });
      });
      return render();
    }
  }
});

/* ---------- Eingaben außerhalb des Weinformulars ---------- */
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'ov-q') return;
  if (t.id === 'q') { UI.filter.q = t.value; return renderResults(); }
  if (t.dataset.f && !t.closest('#wine-form')) {
    UI.filter[t.dataset.f] = t.type === 'checkbox' ? t.checked : t.value;
    return renderResults();
  }
});
document.addEventListener('change', async e => {
  const t = e.target, s = Store.state;
  if (t.id === 'sort') { UI.sort = t.value; return renderResults(); }
  if (t.id === 'plan-zone') { UI.planZone = t.value; return render(); }
  if (t.id === 'theme') { await Store.commit(st => { st.meta.theme = t.value; }); return applyTheme(); }
  if (t.dataset.locName) {
    const v = t.value.trim(); if (!v) { UI.toast('Der Name darf nicht leer sein.'); return render(); }
    await Store.commit(st => { st.locations.find(l => l.id === t.dataset.locName).name = v; }); return UI.toast('Gespeichert.');
  }
  if (t.dataset.zone && t.dataset.k) {
    const [locId, zoneId] = t.dataset.zone.split('|'), k = t.dataset.k;
    const z = findZone(s, locId, zoneId);
    if (k === 'name') { if (!t.value.trim()) { UI.toast('Der Name darf nicht leer sein.'); return render(); } }
    else {
      const n = toInt(t.value);
      if (!Number.isInteger(n) || n < 1 || n > 50) { UI.toast('Bitte eine Zahl von 1 bis 50 eingeben.'); return render(); }
      const used = s.wines.some(w => quantity(w) > 0 && w.placements.some(p => p.count > 0 && p.locationId === locId && p.zoneId === zoneId && (k === 'rows' ? p.row > n : p.col > n)));
      if (used) { UI.toast(`Verkleinern nicht möglich: Es liegen Flaschen außerhalb von ${n} ${k === 'rows' ? 'Reihen' : 'Fächern'}.`); return render(); }
    }
    await Store.commit(st => { const zz = findZone(st, locId, zoneId); zz[k] = k === 'name' ? t.value.trim() : toInt(t.value); });
    return UI.toast('Gespeichert.');
  }
  if (t.id === 'imp-json' && t.files[0]) {
    const text = await t.files[0].text(); t.value = '';
    try {
      const inc = parseImportJSON(text);
      const choice = s.wines.length ? await UI.dialog({ title: 'Backup einspielen', html: `<p>Die Datei enthält <strong>${inc.wines.length}</strong> Weine. Du hast aktuell ${s.wines.length}.</p><p><strong>Ersetzen</strong>: aktueller Stand wird komplett überschrieben.<br><strong>Zusammenführen</strong>: neue Weine werden ergänzt, bei gleichen Weinen gewinnt die neuere Änderung.</p>`,
        buttons: [{ label: 'Abbrechen', value: null }, { label: 'Zusammenführen', value: 'merge' }, { label: 'Ersetzen', value: 'replace', cls: 'primary' }] }) : 'replace';
      if (!choice) return;
      let msg;
      await Store.commit(st => {
        if (choice === 'replace') { Object.keys(st).forEach(k => delete st[k]); Object.assign(st, inc); msg = `${inc.wines.length} Weine wiederhergestellt.`; }
        else { const m = mergeStates(st, inc); Object.assign(st, m.state); msg = `${m.added} neu, ${m.updated} aktualisiert.`; }
      });
      $('#imp-result').innerHTML = `<div class="banner info" role="status">✔ ${esc(msg)}</div>`; UI.toast(msg);
    } catch (err) {
      $('#imp-result').innerHTML = `<div class="errors" role="alert"><strong>Import abgebrochen – es wurde nichts geändert.</strong><br>${esc(err.message)}${err.details ? `<ul>${err.details.map(d => `<li>${esc(d)}</li>`).join('')}</ul>` : ''}</div>`;
    }
  }
  if (t.id === 'imp-csv' && t.files[0]) {
    const text = await t.files[0].text(); t.value = '';
    try {
      const { wines, errors } = importCSV(text, s);
      if (wines.length) await Store.commit(st => st.wines.push(...wines));
      $('#imp-result').innerHTML = `<div class="${errors.length ? 'errors' : 'banner info'}" role="status">${wines.length} Wein(e) importiert.${errors.length ? `<br>${errors.length} Zeile(n) übersprungen:<ul>${errors.slice(0, 20).map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}</div>`;
    } catch (err) { $('#imp-result').innerHTML = `<div class="errors" role="alert"><strong>Import abgebrochen.</strong><br>${esc(err.message)}</div>`; }
  }
});
document.addEventListener('submit', async e => {
  const f = e.target, r = route();
  if (f.dataset.actForm === 'ov-search') {
    e.preventDefault();
    UI.filter.q = $('#ov-q').value.trim(); UI.filter.scope = 'bestand';
    // „passt zu …“ → Speisen-Filter statt Volltext
    const m = UI.filter.q.match(/^passt zu\s+(.+)/i);
    if (m) { UI.filter.food = m[1]; UI.filter.q = ''; UI.filterOpen = true; }
    location.hash = '#/keller'; return;
  }
  if (f.id === 'move-form') {
    e.preventDefault();
    const fd = new FormData(f); let err;
    const ok = await Store.commit(st => { err = applyMovement(st.wines.find(x => x.id === r.id), { kind: fd.get('kind'), qty: toInt(fd.get('qty')), date: fd.get('date'), note: fd.get('note'), placementId: fd.get('placementId') }); if (err) throw new Error(err); });
    if (!ok) { $('#mv-err').innerHTML = `<div class="errors" role="alert">${esc(err || 'Fehler')}</div>`; $$('.toast').forEach(t => t.remove()); return; }
    UI.toast('Gebucht.'); return render();
  }
  if (f.id === 'tasting-form') {
    e.preventDefault();
    const fd = new FormData(f), text = (fd.get('text') || '').toString().trim();
    if (!text) { UI.toast('Bitte einen Text eingeben.'); return $('#t-text').focus(); }
    await Store.commit(st => st.wines.find(x => x.id === r.id).tastings.push({ id: uuid(), date: fd.get('date') || todayISO(), text, rating: toInt(fd.get('rating')) }));
    UI.toast('Notiz gespeichert.'); return render();
  }
});

$('#btn-settings').addEventListener('click', () => { location.hash = '#/daten'; });
window.addEventListener('hashchange', render);
window.addEventListener('scroll', () => $('header.top').classList.toggle('scrolled', window.scrollY > 8), { passive: true });

function applyTheme() {
  const t = Store.state.meta.theme;
  if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
}

/* =========================================================================
   9. START
   ========================================================================= */
(async function start() {
  await Store.init();
  applyTheme();
  render();
  // Service Worker nur über http(s) – per Doppelklick (file://) nicht möglich und nicht nötig.
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    navigator.serviceWorker.register('sw.js').catch(err => console.warn('Service Worker:', err));
  }
})();
</script>
