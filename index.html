/* =====================================================================
   DESIGN-TOKENS – Layout „A2 · Weinfarben“
   Creme, Bordeaux, Anthrazit + eine Farbe je Weintyp.
   Dark Mode: automatisch (Systemeinstellung) oder manuell (data-theme).
   ===================================================================== */
:root {
  --bg: #F6EFE3; --surface: #FFFFFF; --surface-2: #FBF7EF; --surface-3: #EFE5D3;
  --text: #2A2522; --text-2: #6B625A; --line: #D9CBB3; --line-soft: #E9DECB;
  --accent: #6E1B2C; --accent-ink: #FFFFFF; --accent-soft: #F1DFE2; --gold: #C9A45C;
  --focus: #1D5FBF; --shadow: 0 1px 2px rgba(42,37,34,.08), 0 2px 8px rgba(42,37,34,.05);
  /* Weintyp: Fläche (Streifen, Band) und Schrift (Jahrgang, gut lesbar) */
  --t-rot: #7A1F33; --tt-rot: #7A1F33;
  --t-weiss: #D4B85E; --tt-weiss: #84680F;
  --t-schaum: #9AA65A; --tt-schaum: #5B6526;
  --t-rose: #E3879A; --tt-rose: #A83A52;
  --t-suess: #C47F28; --tt-suess: #8A5510;
  --t-likoer: #8B4A2B; --tt-likoer: #6E3A20;
  /* Ampel: Punkt + Pille (Hintergrund / Schrift) */
  --s-lagern: #2F6FB3;  --sb-lagern: #DCE8F6;  --st-lagern: #1F4E86;
  --s-reif: #2E7D4F;    --sb-reif: #DDF0E3;    --st-reif: #1E5E38;
  --s-bald: #D9A514;    --sb-bald: #FBEFC4;    --st-bald: #6B4A00;
  --s-over: #A3231B;    --sb-over: #FADCD9;    --st-over: #8E1C14;
  --s-none: #8A837C;    --sb-none: #ECE6DD;    --st-none: #5A544E;
  --sb-ext: #F1E8F6;    --st-ext: #4B2E66;     --s-ext: #8E6BB0;
  --now: #C2410C; --now-bg: #FCE9DC; --now-ink: #7C2D12;
  --radius: 10px; --tap: 48px; --sidebar: 248px;
  --serif: "Lora", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  color-scheme: light;
}
/* Dunkle Werte als eigener Block, damit Auto- und Manuell-Modus identisch sind */
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1A1617; --surface: #242021; --surface-2: #2B2526; --surface-3: #342D2E;
  --text: #F1E9DF; --text-2: #B9AEA3; --line: #42393A; --line-soft: #352E2F;
  --accent: #E58C9D; --accent-ink: #1A1617; --accent-soft: #3D262C; --gold: #D9B66E;
  --focus: #8AB4FF; --shadow: 0 1px 2px rgba(0,0,0,.4);
  --t-rot: #C2566E; --tt-rot: #E07D93; --t-weiss: #E2CB7A; --tt-weiss: #E8D28A; --t-schaum: #B6C27A; --tt-schaum: #C3CE8A;
  --t-rose: #F0A1B1; --tt-rose: #F2A9B8; --t-suess: #DDA050; --tt-suess: #E6B067; --t-likoer: #C07A55; --tt-likoer: #D29270;
  --s-lagern: #7DB0EA; --sb-lagern: #1F2C3B; --st-lagern: #A9CBF2; --s-reif: #6FCB93; --sb-reif: #1C3326; --st-reif: #9EDDB5;
  --s-bald: #F0C75A; --sb-bald: #3A3119; --st-bald: #F4D67E; --s-over: #F08A80; --sb-over: #3D2220; --st-over: #F5ABA4;
  --s-none: #8E8781; --sb-none: #2F2B2C; --st-none: #BDB5AD; --sb-ext: #2F2638; --st-ext: #D3BCEA; --s-ext: #B595D6;
  --now: #F29A6B; --now-bg: #3A2418; --now-ink: #F7C2A2;
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #1A1617; --surface: #242021; --surface-2: #2B2526; --surface-3: #342D2E;
  --text: #F1E9DF; --text-2: #B9AEA3; --line: #42393A; --line-soft: #352E2F;
  --accent: #E58C9D; --accent-ink: #1A1617; --accent-soft: #3D262C; --gold: #D9B66E;
  --focus: #8AB4FF; --shadow: 0 1px 2px rgba(0,0,0,.4);
  --t-rot: #C2566E; --tt-rot: #E07D93; --t-weiss: #E2CB7A; --tt-weiss: #E8D28A; --t-schaum: #B6C27A; --tt-schaum: #C3CE8A;
  --t-rose: #F0A1B1; --tt-rose: #F2A9B8; --t-suess: #DDA050; --tt-suess: #E6B067; --t-likoer: #C07A55; --tt-likoer: #D29270;
  --s-lagern: #7DB0EA; --sb-lagern: #1F2C3B; --st-lagern: #A9CBF2; --s-reif: #6FCB93; --sb-reif: #1C3326; --st-reif: #9EDDB5;
  --s-bald: #F0C75A; --sb-bald: #3A3119; --st-bald: #F4D67E; --s-over: #F08A80; --sb-over: #3D2220; --st-over: #F5ABA4;
  --s-none: #8E8781; --sb-none: #2F2B2C; --st-none: #BDB5AD; --sb-ext: #2F2638; --st-ext: #D3BCEA; --s-ext: #B595D6;
  --now: #F29A6B; --now-bg: #3A2418; --now-ink: #F7C2A2;
  color-scheme: dark;
}

/* ===== Grundlayout (Handy zuerst) ===== */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  padding-bottom: calc(78px + env(safe-area-inset-bottom));
}
h1, h2, h3 { font-family: var(--serif); font-weight: 600; line-height: 1.15; }
h1 { font-size: 2rem; margin: 0 0 .5rem; color: var(--accent); }
h2 { font-size: 1.25rem; margin: 1.5rem 0 .6rem; }
h3 { font-size: 1.05rem; margin: 1rem 0 .4rem; }
a { color: var(--accent); }
svg { flex-shrink: 0; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--text-2); }
.small { font-size: .875rem; }
.row { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }
.hidden { display: none !important; }
.serif { font-family: var(--serif); }

/* Kopfzeile */
header.top {
  position: sticky; top: 0; z-index: 10; background: var(--bg);
  padding: calc(.5rem + env(safe-area-inset-top)) 1.25rem .5rem; display: flex; align-items: center; gap: .5rem;
  border-bottom: 1px solid transparent;
}
header.top.scrolled { border-bottom-color: var(--line); }
header.top .crumb { flex: 1; font-size: .75rem; letter-spacing: .18em; text-transform: uppercase; color: var(--text-2); font-weight: 600; }
header.top .crumb.brand { font-family: var(--serif); font-size: 1.2rem; letter-spacing: 0; text-transform: none; color: var(--accent); }
.iconbtn { width: 44px; height: 44px; min-height: 0; padding: 0; border-radius: 22px; border: 1px solid var(--line); background: var(--surface-2); color: var(--accent); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }

main { max-width: 760px; margin: 0 auto; padding: .25rem 1.25rem 1.5rem; }

/* Navigation: unten am Handy, Seitenleiste am Laptop */
nav.tabs {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 10; display: grid; grid-template-columns: repeat(3, 1fr);
  background: var(--surface-2); border-top: 1px solid var(--line); padding: 0 .75rem env(safe-area-inset-bottom);
}
nav.tabs .side-brand, nav.tabs .side-foot { display: none; }
nav.tabs a {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  min-height: 64px; text-decoration: none; color: var(--text-2); font-size: .72rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
  border-top: 3px solid transparent;
}
nav.tabs a[aria-current="page"] { color: var(--accent); border-top-color: var(--accent); }

/* ===== Karten, Buttons, Formulare ===== */
.card { background: var(--surface); border-radius: var(--radius); padding: 1rem; box-shadow: var(--shadow); }
.card + .card { margin-top: .75rem; }
button, .btn {
  font: inherit; min-height: var(--tap); padding: 0 1rem; border-radius: 10px; border: 1px solid var(--line);
  background: var(--surface); color: var(--text); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: .4rem; text-decoration: none; font-weight: 600;
}
button.primary, .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button.danger { color: var(--s-over); border-color: currentColor; background: transparent; }
button.ghost { border-color: transparent; background: transparent; }
button:disabled { opacity: .5; cursor: not-allowed; }
button.sm, .btn.sm { min-height: 40px; padding: 0 .75rem; font-size: .9rem; }

label { display: block; font-weight: 600; font-size: .9rem; margin: .8rem 0 .3rem; }
label .req { color: var(--s-over); }
input, select, textarea {
  font: inherit; width: 100%; min-height: var(--tap); padding: .55rem .75rem; border-radius: 10px;
  border: 1px solid var(--line); background: var(--surface); color: var(--text);
}
textarea { min-height: 88px; resize: vertical; }
input[type="checkbox"] { width: 22px; height: 22px; min-height: 0; accent-color: var(--accent); }
.check { display: flex; align-items: center; gap: .5rem; font-weight: 400; margin: .5rem 0; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 .75rem; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0 .75rem; }
.field-error { color: var(--st-over); font-size: .875rem; margin-top: .25rem; }
[aria-invalid="true"] { border-color: var(--s-over); border-width: 2px; }
.errors { background: var(--sb-over); color: var(--st-over); border-radius: 10px; padding: .75rem 1rem; margin: .75rem 0; }
.errors ul { margin: .25rem 0 0; padding-left: 1.2rem; }
details.more { margin-top: 1rem; border-top: 1px solid var(--line); padding-top: .5rem; }
details.more > summary { cursor: pointer; font-weight: 700; min-height: var(--tap); display: flex; align-items: center; color: var(--accent); }
fieldset { border: 1px solid var(--line); border-radius: 10px; margin: .8rem 0; padding: .25rem .8rem .8rem; background: var(--surface-2); }
legend { font-weight: 700; font-size: .9rem; padding: 0 .3rem; }
.stickybar { position: sticky; bottom: calc(70px + env(safe-area-inset-bottom)); background: var(--bg); padding: .75rem 0; display: flex; gap: .5rem; z-index: 5; }
.stickybar > * { flex: 1; }

/* Abschnittsüberschrift in Kapitälchen mit Linie */
.sh { display: flex; align-items: center; gap: .6rem; margin: 1.5rem 0 .6rem; }
.sh h2 { margin: 0; font-family: inherit; font-size: .75rem; letter-spacing: .18em; text-transform: uppercase; font-weight: 700; color: var(--accent); }
.sh::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.sh a { order: 2; font-size: .85rem; font-weight: 700; text-decoration: none; }

/* ===== Übersicht: Kopf mit Typ-Band und Suche ===== */
.hero h1 { font-size: 2.4rem; margin: .1rem 0 .7rem; }
.typeband { display: flex; height: 5px; border-radius: 3px; overflow: hidden; gap: 1px; margin-bottom: .9rem; background: var(--surface-3); }
.typeband span { display: block; }
.search { display: flex; align-items: center; gap: .6rem; background: var(--surface); border-radius: 12px; min-height: 50px; padding: 0 .9rem; box-shadow: var(--shadow); color: var(--accent); }
.search input { border: 0; outline: none; padding: 0; min-height: 48px; background: transparent; flex: 1; font-size: 1rem; }
.search:focus-within { outline: 3px solid var(--focus); outline-offset: 2px; }

/* Typfarben */
.ty-rot { --ty: var(--t-rot); --tyt: var(--tt-rot); } .ty-weiss { --ty: var(--t-weiss); --tyt: var(--tt-weiss); }
.ty-schaum { --ty: var(--t-schaum); --tyt: var(--tt-schaum); } .ty-rose { --ty: var(--t-rose); --tyt: var(--tt-rose); }
.ty-suess { --ty: var(--t-suess); --tyt: var(--tt-suess); } .ty-likoer { --ty: var(--t-likoer); --tyt: var(--tt-likoer); }
.swatch { width: .7rem; height: .7rem; border-radius: 50%; background: var(--ty); display: inline-block; }

/* ===== Kennzahlen ===== */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .5rem; margin-top: 1rem; }
.kpi { background: var(--surface-2); border-radius: 8px; border-top: 4px solid var(--kc, var(--line)); padding: .5rem .6rem .55rem; min-width: 0; text-decoration: none; color: var(--text); }
.kpi .v { font-family: var(--serif); font-size: 1.55rem; font-weight: 700; line-height: 1.1; font-variant-numeric: lining-nums tabular-nums; white-space: nowrap; }
.kpi .l { font-size: .75rem; color: var(--text-2); }
.kpi.k1 { --kc: var(--t-rot); } .kpi.k2 { --kc: var(--t-weiss); } .kpi.k3 { --kc: var(--t-schaum); }
.kpi.k4 { --kc: var(--now); background: var(--now-bg); }
.kpi.k4 .v { color: var(--now); } .kpi.k4 .l { color: var(--now-ink); font-weight: 600; }
@media (max-width: 370px) { .kpi .v { font-size: 1.3rem; } }

/* ===== Status-Pillen ===== */
.badge { display: inline-flex; align-items: center; gap: .35rem; padding: .12rem .55rem; border-radius: 999px; font-size: .75rem; font-weight: 700; white-space: nowrap; background: var(--pb); color: var(--pt); }
.badge::before { content: ""; width: .5rem; height: .5rem; border-radius: 50%; background: var(--pd); }
.st-lagern { --pb: var(--sb-lagern); --pt: var(--st-lagern); --pd: var(--s-lagern); }
.st-trinkreif { --pb: var(--sb-reif); --pt: var(--st-reif); --pd: var(--s-reif); }
.st-bald { --pb: var(--sb-bald); --pt: var(--st-bald); --pd: var(--s-bald); }
.st-ueberfaellig { --pb: var(--sb-over); --pt: var(--st-over); --pd: var(--s-over); }
.st-leer { --pb: var(--sb-none); --pt: var(--st-none); --pd: var(--s-none); }
.st-extern { --pb: var(--sb-ext); --pt: var(--st-ext); --pd: var(--s-ext); }
.st-wish { --pb: var(--accent-soft); --pt: var(--accent); }
.st-wish::before { display: none; }
.est { font-weight: 400; font-style: italic; opacity: .85; }
.vivino { display: inline-flex; align-items: center; font-size: .75rem; font-weight: 700; color: var(--accent); background: var(--accent-soft); border-radius: 6px; padding: .1rem .45rem; white-space: nowrap; }

/* ===== Weinkarte (Liste) ===== */
.list { display: grid; gap: .6rem; }
.wine {
  display: grid; grid-template-columns: 6px 3.6rem minmax(0, 1fr) auto; gap: .75rem; align-items: center;
  background: var(--surface); border-radius: var(--radius); padding: .65rem .7rem .65rem 0; box-shadow: var(--shadow); min-height: 76px;
}
.wine .stripe { align-self: stretch; border-radius: 0 4px 4px 0; background: var(--ty, var(--line)); }
.wine .vint { font-family: var(--serif); font-size: 1.6rem; font-weight: 700; color: var(--tyt, var(--text)); line-height: 1; font-variant-numeric: lining-nums; }
.wine .vint.nv { font-size: 1.35rem; }
.wine .info { display: flex; flex-direction: column; gap: .25rem; min-width: 0; }
.wine a.title { color: var(--text); text-decoration: none; font-weight: 650; font-size: 1rem; line-height: 1.25; }
.wine a.title::after { content: ""; position: absolute; inset: 0; } /* ganze Karte klickbar */
.wine { position: relative; }
.wine .minus, .wine .qty { position: relative; z-index: 1; }
.wine .meta { font-size: .8rem; color: var(--text-2); display: flex; align-items: center; gap: .4rem; flex-wrap: wrap; }
.wine .meta .pin { display: inline-flex; align-items: center; gap: .2rem; }
.wine .meta.prod { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wine .qty { display: flex; align-items: center; gap: .5rem; }
.wine .qty .n { font-family: var(--serif); font-weight: 700; font-size: 1.15rem; text-align: right; font-variant-numeric: lining-nums tabular-nums; }
.wine .qty .n small { font-family: inherit; font-size: .7rem; color: var(--text-2); font-weight: 600; display: block; line-height: 1; }
.wine .minus { width: 48px; min-height: 44px; height: 44px; padding: 0; border-radius: 22px; border: 1.5px solid var(--accent); background: transparent; color: var(--accent); font-weight: 700; }
.wine .minus:hover { background: var(--accent); color: var(--accent-ink); }
.wine.s-leer { opacity: .75; }
.empty { text-align: center; padding: 2rem 1rem; color: var(--text-2); }

/* ===== Lagerplan-Kurzansicht + „Woanders getrunken“ (wie Layout A) ===== */
.plan-teaser { background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; margin-top: 1rem; }
.plan-teaser a.zrow { display: flex; gap: 1rem; align-items: center; padding: .85rem 1rem; text-decoration: none; color: var(--text); }
.plan-teaser a.zrow + a.zrow { border-top: 1px solid var(--line-soft); }
.mg-box { width: 120px; flex-shrink: 0; display: flex; }
.minigrid { display: grid; gap: 3px; }
.minigrid i { width: 9px; height: 9px; border-radius: 50%; border: 1px solid var(--line); display: block; }
.minigrid i.o { border: 0; }
.minigrid i.s-lagern { background: var(--s-lagern); } .minigrid i.s-trinkreif { background: var(--s-reif); }
.minigrid i.s-bald { background: var(--s-bald); } .minigrid i.s-ueberfaellig { background: var(--s-over); }
.zrow .zname { font-family: var(--serif); font-size: 1.05rem; font-weight: 600; }
.zrow .go { font-weight: 700; color: var(--accent); font-size: .9rem; }
.ext-row { display: flex; align-items: center; gap: .75rem; padding: .85rem 0; margin-top: .75rem; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.ext-row { flex-wrap: nowrap; }
.ext-row .txt { flex: 1; min-width: 0; }
.ext-row a { font-weight: 700; font-size: .9rem; }

.bars { display: grid; gap: .4rem; }
.bar { display: grid; grid-template-columns: minmax(5rem, 7.5rem) 1fr 2rem; align-items: center; gap: .5rem; font-size: .9rem; }
.bar .track { display: block; background: var(--surface-3); border-radius: 6px; height: .6rem; overflow: hidden; }
.bar .fill { display: block; background: var(--ty, var(--accent)); height: 100%; border-radius: 6px; }
.bar .n { text-align: right; font-variant-numeric: tabular-nums; }

/* ===== Filter / Segmente ===== */
.searchbar { display: flex; gap: .5rem; }
.searchbar .search { flex: 1; }
.chips { display: flex; gap: .4rem; flex-wrap: wrap; margin: .6rem 0; }
.chip { min-height: 38px; padding: 0 .8rem; border-radius: 999px; font-size: .85rem; background: var(--surface); }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.seg { display: flex; background: var(--surface-3); border-radius: 12px; padding: 4px; margin: .25rem 0 .9rem; }
.seg > button, .seg > label { flex: 1; display: flex; align-items: center; justify-content: center; gap: .35rem; min-height: 44px; margin: 0;
  border: 0; border-radius: 9px; background: transparent; color: var(--text-2); font-weight: 700; font-size: .88rem; cursor: pointer; text-align: center; padding: 0 .5rem; }
.seg > button[aria-checked="true"], .seg > label:has(input:checked) { background: var(--surface); color: var(--accent); box-shadow: var(--shadow); }
.seg > label input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.seg > label:has(input:focus-visible) { outline: 3px solid var(--focus); }
.seg .n { font-weight: 400; color: var(--text-2); font-size: .8rem; }
.lbl-spacer { display: block; height: 2.05rem; }

/* ===== Lagerplan (volle Ansicht) ===== */
.plan-wrap { overflow-x: auto; }
.plan { display: grid; gap: 4px; min-width: max-content; }
.plan.fluid { min-width: 0; width: 100%; }
.plan.fluid .cell { width: auto; height: auto; aspect-ratio: 1; min-width: 28px; max-width: 60px; }
.plan .hdr { font-size: .75rem; color: var(--text-2); text-align: center; align-self: end; }
.plan .rh { font-size: .75rem; color: var(--text-2); display: grid; place-items: center; }
.cell { width: 46px; height: 46px; min-height: 0; padding: 0; border-radius: 50%; font-size: .8rem; font-weight: 700; border: 1px dashed var(--line); background: transparent; color: var(--text-2); }
.cell.occ { border-style: solid; color: #fff; }
.cell.occ.s-lagern { background: var(--s-lagern); border-color: var(--s-lagern); }
.cell.occ.s-trinkreif { background: var(--s-reif); border-color: var(--s-reif); }
.cell.occ.s-bald { background: var(--s-bald); border-color: var(--s-bald); color: #2A2522; }
.cell.occ.s-ueberfaellig { background: var(--s-over); border-color: var(--s-over); }
:root[data-theme="dark"] .cell.occ { color: #1A1617; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .cell.occ { color: #1A1617; } }
.cell.multi { outline: 2px solid var(--text); outline-offset: -5px; }
.legend { display: flex; gap: .4rem; flex-wrap: wrap; margin-top: .6rem; }

/* ===== Detailansicht ===== */
.dt-head { display: grid; grid-template-columns: 6px 1fr; gap: .9rem; margin: .5rem 0 1rem; }
.dt-head .stripe { background: var(--ty); border-radius: 3px; }
.dt-head .vint { font-family: var(--serif); color: var(--tyt); font-size: 1.1rem; font-weight: 700; }
.dt-head h1 { margin: .1rem 0 .2rem; }
dl.facts { display: grid; grid-template-columns: max-content 1fr; gap: .4rem 1rem; margin: 0; }
dl.facts dt { color: var(--text-2); font-size: .9rem; }
dl.facts dd { margin: 0; }
.photo { max-width: 100%; max-height: 320px; border-radius: 10px; display: block; margin: .5rem 0; }
.hist { list-style: none; padding: 0; margin: 0; }
.hist li { display: flex; gap: .75rem; padding: .5rem 0; border-bottom: 1px solid var(--line-soft); align-items: baseline; }
.hist .d { color: var(--text-2); font-size: .85rem; min-width: 6.2rem; font-variant-numeric: tabular-nums; }
.hist .q { font-weight: 700; min-width: 2.5rem; font-variant-numeric: tabular-nums; }
.plus { color: var(--s-reif); } .minusq { color: var(--s-over); }
.bigqty { font-family: var(--serif); font-size: 2.4rem; font-weight: 700; line-height: 1; font-variant-numeric: lining-nums; }
.stars { color: var(--gold); letter-spacing: 2px; }
.star-input { display: flex; gap: .25rem; align-items: center; }
.star-input button { min-width: 44px; font-size: 1.5rem; padding: 0; border: 0; background: transparent; color: var(--line); }
.star-input button[aria-pressed="true"] { color: var(--gold); }

/* ===== Banner, Toast, Dialog ===== */
.banner { border-radius: var(--radius); padding: .75rem 1rem; margin: .5rem 0 1rem; display: flex; gap: .75rem; align-items: center; flex-wrap: wrap; }
.banner > div:first-child { flex: 1; min-width: 12rem; }
.banner.warn { background: var(--sb-bald); color: var(--text); border: 1px solid var(--s-bald); }
.banner.info { background: var(--surface-2); color: var(--text); border: 1px solid var(--line); }
.banner.err { background: var(--sb-over); color: var(--text); border: 1px solid var(--s-over); }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom)); z-index: 50;
  background: var(--text); color: var(--bg); padding: .6rem .6rem .6rem 1rem; border-radius: 12px; display: flex; gap: .75rem; align-items: center;
  max-width: calc(100% - 2rem); box-shadow: 0 4px 16px rgba(0,0,0,.25);
}
.toast button { min-height: 40px; background: transparent; color: var(--bg); border-color: var(--bg); }
dialog { border: 0; border-radius: 14px; padding: 1.25rem; max-width: 440px; width: calc(100% - 2rem); background: var(--surface); color: var(--text); }
dialog::backdrop { background: rgba(0,0,0,.45); }
dialog .actions { display: flex; gap: .5rem; justify-content: flex-end; margin-top: 1rem; flex-wrap: wrap; }
table.simple { width: 100%; border-collapse: collapse; font-size: .9rem; }
table.simple th, table.simple td { text-align: left; padding: .4rem .3rem; border-bottom: 1px solid var(--line-soft); }

/* =====================================================================
   LAPTOP / DESKTOP (ab 960 px): Seitenleiste links, breiterer Inhalt,
   Übersicht und Detail zweispaltig, Weinliste als Kachelraster.
   ===================================================================== */
@media (min-width: 960px) {
  body { padding-bottom: 0; padding-left: var(--sidebar); }
  nav.tabs {
    top: 0; bottom: 0; right: auto; width: var(--sidebar); display: flex; flex-direction: column; gap: .25rem;
    padding: 1.5rem 1rem; border-top: 0; border-right: 1px solid var(--line);
  }
  nav.tabs .side-brand { display: block; font-family: var(--serif); font-size: 1.5rem; font-weight: 600; color: var(--accent); padding: 0 .75rem 1rem; line-height: 1.15; }
  nav.tabs .side-brand small { display: block; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: .7rem; letter-spacing: .18em; text-transform: uppercase; color: var(--text-2); font-weight: 600; margin-top: .4rem; }
  nav.tabs a { flex-direction: row; justify-content: flex-start; gap: .75rem; min-height: 48px; padding: 0 .75rem; border-top: 0; border-left: 3px solid transparent; border-radius: 0 8px 8px 0; font-size: .82rem; }
  nav.tabs a:hover { background: var(--surface-3); }
  nav.tabs a[aria-current="page"] { border-left-color: var(--accent); background: var(--surface); }
  nav.tabs .side-foot { display: block; margin-top: auto; padding: 0 .75rem; font-size: .8rem; color: var(--text-2); }
  nav.tabs .side-foot a { display: inline; min-height: 0; padding: 0; border: 0; text-transform: none; letter-spacing: 0; font-size: .85rem; color: var(--accent); }
  header.top { padding: 1rem 2.5rem .75rem; }
  header.top .crumb { visibility: hidden; }
  main { max-width: 1180px; padding: .5rem 2.5rem 3rem; margin: 0; }
  .hero { display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, 420px); gap: 0 2rem; align-items: end; }
  .hero h1 { font-size: 2.9rem; }
  .hero .search { grid-column: 2; grid-row: 1 / span 2; align-self: end; margin-bottom: .9rem; }
  .ov-grid { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(300px, 1fr); gap: 0 2.5rem; align-items: start; }
  .ov-side .plan-teaser { margin-top: 0; }
  .ov-side { position: sticky; top: 5rem; }
  .ov-side > .sh:first-child { margin-top: 1.5rem; }
  .kpi .v { font-size: 2rem; }
  .kpi { padding: .7rem .9rem .8rem; }
  .list.grid { grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); }
  .dt-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 1rem 1.5rem; align-items: start; }
  .dt-grid > div > .card + .card { margin-top: 1rem; }
  .form-wrap { max-width: 820px; }
  #filters .grid2 { grid-template-columns: repeat(4, 1fr); }
  .stickybar { bottom: 0; }
  .toast { bottom: 1.5rem; left: calc(50% + var(--sidebar) / 2); }
  .seg { max-width: 560px; }
}
@media print { header.top, nav.tabs, .stickybar, button { display: none !important; } body { padding: 0; } }
</style>

<noscript><p style="padding:1rem">Bitte JavaScript aktivieren – die App läuft komplett in deinem Browser.</p></noscript>
<script>
'use strict';
/* =========================================================================
   WEINKELLER – private Kellerverwaltung, komplett im Browser.

   Aufbau dieser Datei (von unten nach oben abhängig, nie umgekehrt):
     1. SCHEMA      – Datenmodell, Konstanten, Schema-Version
     2. UTIL        – kleine Helfer (UUID, Datum, Formatierung)
     3. MIGRATION   – hebt alte Datenstände auf die aktuelle schemaVersion
     4. VALIDATION  – Eingabeprüfung mit deutschen Fehlermeldungen
     5. STORAGE     – Speicherschicht (IndexedDB, Fallback localStorage).
                      Austauschbar: jede Implementierung braucht nur
                      load() → state|null und save(state).
     6. LOGIC       – Geschäftslogik: Bestand, Trinkreife, Suche, Statistik,
                      Import/Export. Kennt weder DOM noch Speicher.
     7. STORE       – hält den App-Zustand, ruft Logik + Speicher auf.
     8. UI          – Ansichten (Übersicht, Keller, Neu, Detail, Daten).
     9. START       – Initialisierung, Service Worker.

   Für Erweiterungen (auch durch ein KI-Modell): neue Felder im SCHEMA
   ergänzen, SCHEMA_VERSION erhöhen, Migrationsschritt in MIGRATIONS
   anlegen, Validierung + Formular + CSV-Spalten anpassen.
   ========================================================================= */

/* =========================================================================
   1. SCHEMA
   Das vollständige JSON-Schema liegt zusätzlich als schema.json bei.
   ========================================================================= */
const SCHEMA_VERSION = 2;   // v2: Herkunft (Keller/extern), Nachkauf-Wunsch, Vivino
const APP_ID = 'weinkeller';

/** Weintypen: interner Schlüssel → Anzeigename */
const WINE_TYPES = {
  rot: 'Rot', weiss: 'Weiß', rose: 'Rosé', schaum: 'Schaumwein', suess: 'Süßwein', likoer: 'Likörwein'
};

/** Arten von Bestandsbewegungen. sign: +1 Zugang, -1 Entnahme, 0 = Vorzeichen kommt aus qty */
const MOVEMENT_KINDS = {
  kauf:      { label: 'Kauf / Zugang', sign: +1 },
  getrunken: { label: 'Getrunken',     sign: -1 },
  verschenkt:{ label: 'Verschenkt',    sign: -1 },
  verdorben: { label: 'Verdorben / Korkig', sign: -1 },
  korrektur: { label: 'Korrektur (Inventur)', sign: 0 }
};

/** Status der Trinkreife-Ampel, Reihenfolge = Dringlichkeit (höher = dringender) */
const STATUS = {
  ueberfaellig: { label: 'Überfällig',              urgency: 4 },

/* =========================================================================
   2. UTIL
   ========================================================================= */
function uuid() {
  if (globalThis.crypto && crypto.randomUUID) return crypto.randomUUID();
  // Fallback für ältere Browser / file:// ohne secure context
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = (crypto.getRandomValues(new Uint8Array(1))[0] & 15);
    return (c === 'x' ? r : (r & 0x3) | 0x8).toString(16);
  });
}
const currentYear = () => new Date().getFullYear();
const todayISO = () => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
};
const fmtEUR = new Intl.NumberFormat('de-DE', { style: 'currency', currency: 'EUR' });
const fmtNum = new Intl.NumberFormat('de-DE', { maximumFractionDigits: 2 });
const fmtDate = iso => {
  if (!iso) return '';
  const [y, m, d] = String(iso).slice(0, 10).split('-');
  return d && m ? `${d}.${m}.${y}` : iso;
};
const fmtSize = l => l === 0.75 ? '0,75 l' : `${fmtNum.format(l)} l`;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = s => String(s ?? '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/ß/g, 'ss');
const toInt = v => { if (v === '' || v == null) return null; const n = Number(String(v).trim()); return Number.isInteger(n) ? n : NaN; };
/** "12,50" oder "12.50" → 12.5 ; leer → null ; Unsinn → NaN */
const toNum = v => {
  if (v === '' || v == null) return null;
  if (typeof v === 'number') return v;
  let s = String(v).trim().replace(/\s|€/g, '');
  if (s.includes(',') ) s = s.replace(/\./g, '').replace(',', '.');
  const n = Number(s);
  return Number.isFinite(n) ? n : NaN;
};
const splitList = s => String(s ?? '').split(/[,;\/]/).map(x => x.trim()).filter(Boolean);
const daysBetween = (isoA, isoB) => Math.floor((new Date(isoB) - new Date(isoA)) / 864e5);
const deepClone = o => o === undefined ? undefined : JSON.parse(JSON.stringify(o));

/* =========================================================================
   3. MIGRATION
   Jede Funktion hebt die Daten von Version n auf n+1. Beim Laden und beim
   Import werden alle nötigen Schritte nacheinander ausgeführt.
   ========================================================================= */
const MIGRATIONS = {
  // v1 → v2: Herkunft, Nachkauf-Wunsch und Vivino-Felder ergänzen
  1: s => {
    (s.wines || []).forEach(w => {
      w.origin = 'keller'; w.externalPlace = ''; w.wishlist = false; w.vivinoRating = null; w.vivinoUrl = '';
    });
    s.schemaVersion = 2;
    return s;
  }
  // Nächste Änderung: 2: s => { …; s.schemaVersion = 3; return s; }
};

function migrate(state) {
  if (!state || typeof state !== 'object') throw new Error('Keine gültigen Daten.');
  let v = state.schemaVersion;
  if (!Number.isInteger(v)) throw new Error('Feld „schemaVersion“ fehlt – das ist keine Weinkeller-Datei.');
  if (v > SCHEMA_VERSION) throw new Error(`Die Datei stammt aus einer neueren App-Version (Schema ${v}). Bitte aktualisiere die App.`);
  while (v < SCHEMA_VERSION) {
    const step = MIGRATIONS[v];
    if (!step) throw new Error(`Keine Migration von Schema ${v} vorhanden.`);
    state = step(state);
    v = state.schemaVersion;
  }
  // Fehlende Felder mit Standardwerten auffüllen (robust gegen Handbearbeitung)
  state.wines = (state.wines || []).map(w => Object.assign(emptyWine(), w));
  state.locations = Array.isArray(state.locations) && state.locations.length ? state.locations : defaultLocations();
  state.meta = Object.assign({ lastBackupAt: null, theme: 'auto' }, state.meta || {});
  state.app = APP_ID;
  return state;
}

/* =========================================================================
   4. VALIDATION
   validateWine(w) → { ok, errors: {feld: 'Meldung'} }
   ========================================================================= */
function validateWine(w, state) {
  const e = {};
  const y = currentYear();
  if (!String(w.name || '').trim()) e.name = 'Bitte einen Namen oder eine Cuvée angeben.';
  if (!String(w.producer || '').trim()) e.producer = 'Bitte das Weingut / den Produzenten angeben.';
  if (w.vintage !== 'NV') {
    if (w.vintage == null || w.vintage === '') e.vintage = 'Bitte einen Jahrgang angeben oder „jahrgangslos (NV)“ ankreuzen.';
    else if (!Number.isInteger(w.vintage)) e.vintage = 'Der Jahrgang muss eine Jahreszahl sein, z. B. 2019.';
    else if (w.vintage < 1800 || w.vintage > y + 1) e.vintage = `Der Jahrgang ${w.vintage} ist nicht plausibel (erlaubt: 1800 bis ${y + 1}).`;
  }
  if (!WINE_TYPES[w.type]) e.type = 'Bitte einen Weintyp wählen.';

  const yr = (k, label) => {
    const v = w[k];
    if (v == null) return;
    if (!Number.isInteger(v)) e[k] = `„${label}“ muss eine Jahreszahl sein.`;
    else if (v < 1800 || v > 2200) e[k] = `„${label}“ ${v} ist nicht plausibel.`;
  };
  yr('drinkFrom', 'Trinkreif ab'); yr('peak', 'Höhepunkt'); yr('drinkUntil', 'Trinken bis');
  if (!e.drinkFrom && !e.drinkUntil && w.drinkFrom != null && w.drinkUntil != null && w.drinkUntil < w.drinkFrom)
    e.drinkUntil = '„Trinken bis“ darf nicht vor „Trinkreif ab“ liegen.';
  if (!e.peak && w.peak != null) {
    if (w.drinkFrom != null && w.peak < w.drinkFrom) e.peak = 'Der Höhepunkt darf nicht vor „Trinkreif ab“ liegen.';
    else if (w.drinkUntil != null && w.peak > w.drinkUntil) e.peak = 'Der Höhepunkt darf nicht nach „Trinken bis“ liegen.';
  }
  if (Number.isInteger(w.vintage) && Number.isInteger(w.drinkUntil) && w.drinkUntil < w.vintage)
    e.drinkUntil = '„Trinken bis“ darf nicht vor dem Jahrgang liegen.';

  if (w.price != null && (Number.isNaN(w.price) || w.price < 0)) e.price = 'Der Preis muss eine Zahl ab 0 sein, z. B. 18,50.';
  if (w.abv != null && (Number.isNaN(w.abv) || w.abv < 0 || w.abv > 25)) e.abv = 'Alkoholgehalt bitte zwischen 0 und 25 % angeben.';
  if (w.bottleSize != null && (Number.isNaN(w.bottleSize) || w.bottleSize <= 0 || w.bottleSize > 30)) e.bottleSize = 'Bitte eine gültige Flaschengröße wählen.';
  if (w.rating != null && !(Number.isInteger(w.rating) && w.rating >= 1 && w.rating <= 5)) e.rating = 'Bewertung: 1 bis 5 Sterne.';
  if (w.purchaseDate && !/^\d{4}-\d{2}-\d{2}$/.test(w.purchaseDate)) e.purchaseDate = 'Kaufdatum ist kein gültiges Datum.';
  if (!['keller', 'extern'].includes(w.origin)) e.origin = 'Unbekannte Herkunft (erlaubt: Keller oder extern).';
  if (w.vivinoRating != null && (Number.isNaN(w.vivinoRating) || w.vivinoRating < 1 || w.vivinoRating > 5)) e.vivinoRating = 'Die Vivino-Bewertung liegt zwischen 1,0 und 5,0 (z. B. 4,1).';
  if (w.vivinoUrl && !/^https:\/\/(www\.)?vivino\.com\//i.test(w.vivinoUrl)) e.vivinoUrl = 'Der Vivino-Link muss mit https://www.vivino.com/ beginnen.';
  if (w.origin === 'extern' && ((w.movements || []).length || (w.placements || []).some(p => p.count > 0)))
    e.origin = 'Extern getrunkene Weine haben keinen Bestand. Übernimm ihn zuerst in den Keller.';

  // Lagerplätze prüfen
  (w.placements || []).forEach((p, i) => {
    const n = i + 1;
    if (!Number.isInteger(p.count) || p.count < 0) e['placement' + i] = `Lagerplatz ${n}: Anzahl muss eine ganze Zahl ab 0 sein.`;
    if (state) {
      const z = findZone(state, p.locationId, p.zoneId);
      if (!z) e['placement' + i] = `Lagerplatz ${n}: Lager oder Regal existiert nicht.`;
      else if (p.row != null && (p.row < 1 || p.row > z.rows)) e['placement' + i] = `Lagerplatz ${n}: Reihe muss zwischen 1 und ${z.rows} liegen.`;
      else if (p.col != null && (p.col < 1 || p.col > z.cols)) e['placement' + i] = `Lagerplatz ${n}: Fach muss zwischen 1 und ${z.cols} liegen.`;
    }
  });
  const q = quantity(w);
  if (q < 0) e.quantity = 'Die Menge kann nicht unter 0 fallen.';
  const placed = (w.placements || []).reduce((s, p) => s + (p.count || 0), 0);
  if (q >= 0 && placed > q) e.placements = `Auf Lagerplätzen liegen ${placed} Flaschen, im Bestand sind aber nur ${q}.`;
  return { ok: Object.keys(e).length === 0, errors: e };
}

/** Prüft eine komplette Datei (Import) und liefert lesbare Fehler */
function validateState(s) {
  const errs = [];
  if (!Array.isArray(s.wines)) errs.push('Die Datei enthält keine Weinliste („wines“).');
  else s.wines.forEach((w, i) => {
    const r = validateWine(w, s);
    if (!r.ok) errs.push(`Wein ${i + 1} („${w.name || 'ohne Namen'}“): ${Object.values(r.errors).join(' ')}`);
    if (!w.id) errs.push(`Wein ${i + 1}: Es fehlt eine ID.`);
  });
  const ids = new Set();
  (s.wines || []).forEach(w => { if (ids.has(w.id)) errs.push(`Doppelte ID ${w.id}.`); ids.add(w.id); });
  return errs;
}

/* =========================================================================
   5. STORAGE
   Schnittstelle: { name, async load() → state|null, async save(state) }
   Gespeichert wird der komplette Zustand als EIN Objekt. Für 30–1000
   Flaschen ist das schnell genug und macht den Austausch (z. B. gegen
   einen Sync-Server) trivial.
   ========================================================================= */
class IndexedDBStorage {
  constructor() { this.name = 'IndexedDB'; this.db = null; }
  open() {
    return new Promise((res, rej) => {
      if (!globalThis.indexedDB) return rej(new Error('IndexedDB nicht verfügbar'));
      const r = indexedDB.open('weinkeller', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => { this.db = r.result; res(); };
      r.onerror = () => rej(r.error || new Error('IndexedDB-Fehler'));
      r.onblocked = () => rej(new Error('IndexedDB blockiert'));
    });
  }
  async load() {
    if (!this.db) await this.open();
    return new Promise((res, rej) => {
      const t = this.db.transaction('kv', 'readonly').objectStore('kv').get('state');
      t.onsuccess = () => res(t.result ?? null);
      t.onerror = () => rej(t.error);
    });
  }
  async save(state) {
    if (!this.db) await this.open();
    return new Promise((res, rej) => {
      const tx = this.db.transaction('kv', 'readwrite');
      tx.objectStore('kv').put(state, 'state');
      tx.oncomplete = () => res();
      tx.onerror = () => rej(tx.error);
      tx.onabort = () => rej(tx.error || new Error('Speichern abgebrochen (Speicher voll?)'));
    });
  }
}

class LocalStorageStorage {
  constructor() { this.name = 'localStorage'; }
  async load() { const s = localStorage.getItem('weinkeller.state'); return s ? JSON.parse(s) : null; }
  async save(state) {
    try { localStorage.setItem('weinkeller.state', JSON.stringify(state)); }
    catch (e) { throw new Error('Speicher voll – bitte Fotos entfernen oder Backup exportieren.'); }
  }
}

/** Wählt die beste verfügbare Speicherschicht */
async function createStorage() {
  const idb = new IndexedDBStorage();
  try { await idb.open(); return idb; }
  catch { return new LocalStorageStorage(); }
}

/* Kleiner Marker in localStorage: Wenn IndexedDB leer ist, der Marker aber
   sagt „es gab Daten“, warnen wir vor möglichem Datenverlust. */
const Marker = {
  get() { try { return JSON.parse(localStorage.getItem('weinkeller.marker') || 'null'); } catch { return null; } },
  set(count) { try { localStorage.setItem('weinkeller.marker', JSON.stringify({ count, at: new Date().toISOString() })); } catch {} }
};

/* =========================================================================
   6. LOGIC – Bestand
   ========================================================================= */
function movementDelta(m) {
  const k = MOVEMENT_KINDS[m.kind];
  if (!k) return 0;
  return k.sign === 0 ? (m.qty | 0) : k.sign * Math.abs(m.qty | 0);
}
/** Menge = Summe aller Bewegungen */
function quantity(w) { return (w.movements || []).reduce((s, m) => s + movementDelta(m), 0); }
function placedCount(w) { return (w.placements || []).reduce((s, p) => s + (p.count || 0), 0); }

function findLocation(state, id) { return state.locations.find(l => l.id === id); }
function findZone(state, locId, zoneId) { const l = findLocation(state, locId); return l && l.zones.find(z => z.id === zoneId); }
function placementLabel(state, p, short = false) {
  const l = findLocation(state, p.locationId), z = l && l.zones.find(z => z.id === p.zoneId);
  if (!l) return 'Unbekannter Ort';
  const parts = [l.name, z ? z.name : '?'];
  if (p.row) parts.push(short ? `R${p.row}` : `Reihe ${p.row}`);
  if (p.col) parts.push(short ? `F${p.col}` : `Fach ${p.col}`);
  return parts.join(' › ');
}

/**
 * Bucht eine Bewegung. Bei Entnahmen wird – falls angegeben – der Lagerplatz
 * reduziert, sonst der erste Platz mit Flaschen. Liefert Fehlertext oder null.
 */
function applyMovement(w, { kind, qty, date, note, placementId }) {
  if (w.origin === 'extern') return 'Extern getrunkene Weine haben keinen Bestand – zuerst „In den Keller übernehmen“.';
  qty = Math.trunc(Number(qty));
  if (!MOVEMENT_KINDS[kind]) return 'Unbekannte Bewegungsart.';
  if (!Number.isFinite(qty) || qty === 0) return 'Bitte eine Anzahl ungleich 0 angeben.';
  if (kind !== 'korrektur' && qty < 0) return 'Bitte eine positive Anzahl angeben.';
  const m = { id: uuid(), date: date || todayISO(), kind, qty, note: note || '' };
  const delta = movementDelta(m);
  const q = quantity(w);
  if (q + delta < 0) return `Es sind nur ${q} Flasche(n) vorhanden – Entnahme von ${-delta} nicht möglich.`;

  if (delta < 0) {
    // Flaschen von Lagerplätzen abziehen: gewählter Platz zuerst, dann der Rest
    // Reihenfolge: 1. gewählter Platz, 2. Flaschen „ohne Platz“, 3. übrige Plätze
    let rest = -delta;
    const unplaced = Math.max(0, q - placedCount(w));   // vor dem Abziehen ermitteln
    const take = p => {
      const n = Math.min(p.count, rest);
      p.count -= n; rest -= n;
      if (n > 0 && !m.placementId) m.placementId = p.id;
    };
    const chosen = placementId && w.placements.find(p => p.id === placementId);
    if (chosen) take(chosen);
    rest = Math.max(0, rest - unplaced);
    for (const p of w.placements) { if (rest <= 0) break; if (p !== chosen) take(p); }
  } else if (placementId) {
    const p = w.placements.find(p => p.id === placementId);
    if (p) { p.count += delta; m.placementId = p.id; }
  }
  w.movements.push(m);
  w.updatedAt = new Date().toISOString();
  return null;
}

/** Macht die letzte Bewegung rückgängig (für „Rückgängig“ nach Schnell-Entnahme) */
function undoMovement(w, movementId, placementSnapshot) {
  w.movements = w.movements.filter(m => m.id !== movementId);
  if (placementSnapshot) w.placements = placementSnapshot;
  w.updatedAt = new Date().toISOString();
}

/* =========================================================================
   6. LOGIC – Trinkreife
   -------------------------------------------------------------------------
   FAUSTREGELN für die Schätzung, wenn kein Trinkfenster eingetragen ist.
   Angaben = Jahre nach dem Jahrgang: [trinkreif ab, trinken bis].
   Bei jahrgangslosen Weinen (NV) wird ab Kaufjahr gerechnet (sonst ab
   heute). Die Werte sind bewusst vorsichtig und gelten für „gute
   Durchschnittsweine“. Ein Spitzenwein kann deutlich länger reifen –
   darum ist jede Schätzung klar markiert und überschreibbar.

   Reihenfolge der Bestimmung:
     a) Grundwert nach Weintyp (TYPE_RULES)
     b) überschrieben durch die erste passende Rebsorte (GRAPE_RULES),
        nur wenn Typ passt (z. B. Riesling-Regel nicht für Riesling-Sekt)
     c) Aufschlag nach Qualitätsstufe (CLASS_RULES), z. B. GG, Grand Cru
     d) Flaschengröße: Magnum und größer +25 % Lagerzeit, halbe Flasche −25 %
     e) Höhepunkt = trinkreif ab + 60 % der Fensterlänge (gerundet)
   ========================================================================= */
const TYPE_RULES = {
  rot:    [2, 8],
  weiss:  [1, 4],
  rose:   [0, 2],
  schaum: [0, 3],   // jahrgangsloser Sekt/Champagner ab Kauf; Jahrgangsschaumwein siehe unten
  suess:  [3, 20],
  likoer: [0, 15]
};
/** Rebsorten-Regeln: Muster (Kleinschreibung, ohne Akzente) → [ab, bis] je Typ */
const GRAPE_RULES = [
  { types: ['rot'],   match: /nebbiolo|barolo|barbaresco/,            win: [6, 20] },
  { types: ['rot'],   match: /cabernet sauvignon|cabernet franc|petit verdot|aglianico|tannat|mourvedre|monastrell/, win: [4, 15] },
  { types: ['rot'],   match: /syrah|shiraz|tempranillo|sangiovese|brunello|chianti|vino nobile|blaufrankisch|lemberger|touriga/, win: [3, 12] },
  { types: ['rot'],   match: /merlot|grenache|garnacha|malbec|zinfandel|primitivo|nero d.avola|montepulciano/, win: [2, 8] },
  { types: ['rot'],   match: /pinot noir|spatburgunder|blauburgunder|fruhburgunder/, win: [2, 10] },
  { types: ['rot'],   match: /gamay|dornfelder|trollinger|zweigelt|regent|portugieser|dolcetto|lambrusco|schwarzriesling/, win: [1, 4] },
  { types: ['weiss'], match: /riesling/,                               win: [2, 10] },
  { types: ['weiss'], match: /chenin|semillon|furmint|savagnin/,       win: [2, 10] },
  { types: ['weiss'], match: /chardonnay/,                             win: [1, 6] },
  { types: ['weiss'], match: /gruner veltliner|weissburgunder|pinot blanc|silvaner|viognier|marsanne|roussanne/, win: [1, 5] },
  { types: ['weiss'], match: /sauvignon blanc|grauburgunder|pinot grigio|pinot gris|muller.thurgau|rivaner|albarino|verdejo|vermentino|muskateller|gewurztraminer|scheurebe|kerner/, win: [0, 3] },
  { types: ['suess'], match: /riesling|tokaj|furmint|semillon|sauternes|chenin/, win: [5, 30] },
  { types: ['likoer'],match: /vintage port|jahrgangsport/,             win: [10, 40] }
];
/** Qualitätsstufe: Muster → [Zuschlag „ab“, Faktor „bis“-Spanne] */
const CLASS_RULES = [
  { match: /vdp\.?\s*gg|grosses gewachs|\bgg\b|grand cru|gran reserva|vdp\.?\s*grosse lage/, addFrom: 2, factor: 1.6 },
  { match: /premier cru|1er cru|erste lage|vdp\.?\s*erste lage|riserva|reserva|gran selezione|docg|smaragd/, addFrom: 1, factor: 1.3 },
  { match: /beerenauslese|trockenbeerenauslese|eiswein|\bba\b|\btba\b/, addFrom: 2, factor: 1.6 },
  { match: /auslese|spatlese/, addFrom: 1, factor: 1.3 }
];

/** Liefert eine Faustregel-Schätzung {drinkFrom, peak, drinkUntil, basis:[Begründungen]} */
function estimateWindow(w) {
  const basis = [];
  const isNV = w.vintage === 'NV' || w.vintage == null;
  let base;
  if (isNV) {
    const py = w.purchaseDate ? Number(String(w.purchaseDate).slice(0, 4)) : null;
    base = Number.isInteger(py) ? py : currentYear();
    basis.push(`jahrgangslos: gerechnet ab ${py ? 'Kaufjahr' : 'diesem Jahr'} ${base}`);
  } else base = w.vintage;

  let [from, until] = TYPE_RULES[w.type] || [1, 5];
  basis.push(`Typ ${WINE_TYPES[w.type] || '?'}: ${from}–${until} Jahre`);
  if (w.type === 'schaum' && !isNV) { [from, until] = [3, 12]; basis.push('Jahrgangsschaumwein: 3–12 Jahre'); }

  const grapeText = norm((w.grapes || []).join(' ') + ' ' + (w.name || '') + ' ' + (w.appellation || ''));
  const g = GRAPE_RULES.find(r => r.types.includes(w.type) && r.match.test(grapeText));
  if (g) { [from, until] = g.win; basis.push(`Rebsorte/Herkunft (${g.match.source.split('|')[0]} …): ${from}–${until} Jahre`); }

  const cls = norm((w.classification || '') + ' ' + (w.name || ''));
  const c = CLASS_RULES.find(r => r.match.test(cls));
  if (c) {
    until = Math.round(from + (until - from) * c.factor + c.addFrom);
    from += c.addFrom;
    basis.push(`Qualitätsstufe: +${c.addFrom} Jahre reifer, längeres Fenster`);
  }
  if (w.bottleSize >= 1.5) { until = Math.round(until * 1.25); basis.push('Großflasche: reift langsamer (+25 %)'); }
  else if (w.bottleSize && w.bottleSize < 0.75) { until = Math.max(from, Math.round(until * 0.75)); basis.push('kleine Flasche: reift schneller (−25 %)'); }

  const drinkFrom = base + from, drinkUntil = base + until;
  const peak = drinkUntil - drinkFrom >= 2 ? Math.round(drinkFrom + (drinkUntil - drinkFrom) * 0.6) : null;
  return { drinkFrom, peak, drinkUntil, basis };
}

/**
 * Effektives Trinkfenster: eingetragene Werte haben Vorrang, fehlende werden
 * aus der Schätzung ergänzt. estimated: 'none' | 'partial' | 'full'
 */
function effectiveWindow(w) {
  const has = k => Number.isInteger(w[k]);
  if (has('drinkFrom') && has('drinkUntil'))
    return { drinkFrom: w.drinkFrom, peak: has('peak') ? w.peak : null, drinkUntil: w.drinkUntil, estimated: 'none', basis: [] };
  const est = estimateWindow(w);
  const from = has('drinkFrom') ? w.drinkFrom : est.drinkFrom;
  let until = has('drinkUntil') ? w.drinkUntil : est.drinkUntil;
  if (until < from) until = from + Math.max(1, est.drinkUntil - est.drinkFrom);
  const any = has('drinkFrom') || has('drinkUntil') || has('peak');
  const peak = has('peak') ? w.peak : (any ? null : est.peak);
  return { drinkFrom: from, peak, drinkUntil: until, estimated: any ? 'partial' : 'full', basis: est.basis };
}

/**
 * Ampel. year = aktuelles Jahr (für Tests überschreibbar).
 *   überfällig: year > trinken bis
 *   bald:       Höhepunktjahr erreicht ODER ≤ 1 Jahr bis „trinken bis“
 *   lagern:     year < trinkreif ab
 *   trinkreif:  sonst
 */
function maturity(w, year = currentYear()) {
  const win = effectiveWindow(w);
  if (w.origin === 'extern')
    return { key: 'extern', ripeKey: 'extern', label: STATUS.extern.label, reason: w.externalPlace ? `Getrunken: ${w.externalPlace}` : 'Nicht im eigenen Keller.', window: win, score: -1000 };
  const q = quantity(w);
  let key;
  if (year > win.drinkUntil) key = 'ueberfaellig';
  else if (year < win.drinkFrom) key = 'lagern';
  else if ((win.peak != null && year >= win.peak) || win.drinkUntil - year <= 1) key = 'bald';
  else key = 'trinkreif';
  const reason = {
    ueberfaellig: `Seit ${year - win.drinkUntil} Jahr(en) über „trinken bis“ ${win.drinkUntil}.`,
    lagern: `Trinkreif ab ${win.drinkFrom} – noch ${win.drinkFrom - year} Jahr(e).`,
    bald: win.peak != null && year >= win.peak ? `Höhepunkt ${win.peak} erreicht, trinken bis ${win.drinkUntil}.` : `Nur noch bis ${win.drinkUntil} – bald trinken.`,
    trinkreif: `Jetzt genießen – noch ${win.drinkUntil - year} Jahre bis „trinken bis“.`
  }[key];
  // Dringlichkeit zum Sortieren: höher = früher trinken
  const score = STATUS[key].urgency * 1000 + (key === 'ueberfaellig' ? (year - win.drinkUntil) : -(win.drinkUntil - year));
  return { key: q > 0 ? key : 'leer', ripeKey: key, label: q > 0 ? STATUS[key].label : STATUS.leer.label, reason, window: win, score };
}

/* =========================================================================
   6. LOGIC – Suche, Filter, Sortierung
   ========================================================================= */
function searchText(w) {
  return norm([w.name, w.producer, (w.grapes || []).join(' '), w.region, w.country, w.appellation, w.classification,
    w.notes, (w.tags || []).join(' '), w.food, w.source, (w.tastings || []).map(t => t.text).join(' '), w.vintage].join(' '));
}

/** filter: {scope, q, types[], country, region, grape, locationId, statuses[], priceMin, priceMax, vintageMin, vintageMax, food, wishlist}
 *  scope: 'bestand' (im Keller, Menge > 0) · 'archiv' (ausgetrunken) · 'extern' (woanders getrunken) · 'alle' */
function filterWines(state, f, year = currentYear()) {
  const q = norm(f.q).split(/\s+/).filter(Boolean);
  const food = norm(f.food).split(/\s+/).filter(Boolean);
  return state.wines.filter(w => {
    const qty = quantity(w), ext = w.origin === 'extern', scope = f.scope || 'bestand';
    if (scope === 'bestand' && (ext || qty <= 0)) return false;
    if (scope === 'archiv' && (ext || qty > 0)) return false;
    if (scope === 'extern' && !ext) return false;
    if (f.wishlist && !w.wishlist) return false;
    if (q.length) { const t = searchText(w); if (!q.every(x => t.includes(x))) return false; }
    if (food.length) { const t = norm(w.food); if (!food.some(x => t.includes(x))) return false; }
    if (f.types && f.types.length && !f.types.includes(w.type)) return false;
    if (f.country && norm(w.country) !== norm(f.country)) return false;
    if (f.region && norm(w.region) !== norm(f.region)) return false;
    if (f.grape && !(w.grapes || []).some(g => norm(g) === norm(f.grape))) return false;
    if (f.locationId && !(w.placements || []).some(p => p.locationId === f.locationId && p.count > 0)) return false;
    if (f.statuses && f.statuses.length && !f.statuses.includes(maturity(w, year).key)) return false;
    const price = w.price;
    if (f.priceMin != null && f.priceMin !== '' && !(price != null && price >= f.priceMin)) return false;
    if (f.priceMax != null && f.priceMax !== '' && !(price != null && price <= f.priceMax)) return false;
    const v = Number.isInteger(w.vintage) ? w.vintage : null;
    if (f.vintageMin && !(v != null && v >= f.vintageMin)) return false;
    if (f.vintageMax && !(v != null && v <= f.vintageMax)) return false;
    return true;
  });
}

const SORTS = {
  urgency:  { label: 'Trinkreife (dringend zuerst)', fn: (a, b, y) => maturity(b, y).score - maturity(a, y).score },
  vintage:  { label: 'Jahrgang (alt → jung)', fn: (a, b) => (Number.isInteger(a.vintage) ? a.vintage : 9999) - (Number.isInteger(b.vintage) ? b.vintage : 9999) },
  vintageD: { label: 'Jahrgang (jung → alt)', fn: (a, b) => (Number.isInteger(b.vintage) ? b.vintage : 0) - (Number.isInteger(a.vintage) ? a.vintage : 0) },
  price:    { label: 'Preis (hoch → niedrig)', fn: (a, b) => (b.price ?? -1) - (a.price ?? -1) },
  added:    { label: 'Zuletzt hinzugefügt', fn: (a, b) => String(b.createdAt).localeCompare(String(a.createdAt)) },
  rating:   { label: 'Eigene Bewertung', fn: (a, b) => (b.rating ?? 0) - (a.rating ?? 0) },
  vivino:   { label: 'Vivino-Bewertung', fn: (a, b) => (b.vivinoRating ?? 0) - (a.vivinoRating ?? 0) },
  name:     { label: 'Name A–Z', fn: (a, b) => a.name.localeCompare(b.name, 'de') }
};
function sortWines(list, key, year = currentYear()) {
  const s = SORTS[key] || SORTS.urgency;
  return [...list].sort((a, b) => s.fn(a, b, year) || a.name.localeCompare(b.name, 'de'));
}

/** „Jetzt trinken“: gelb + rot, nur mit Bestand, dringendste zuerst */
function drinkNow(state, year = currentYear()) {
  return sortWines(state.wines.filter(w => w.origin !== 'extern' && quantity(w) > 0 && ['ueberfaellig', 'bald'].includes(maturity(w, year).key)), 'urgency', year);
}

/* =========================================================================
   6. LOGIC – Statistik
   ========================================================================= */
function stats(state, year = currentYear()) {
  let bottles = 0, value = 0, unpriced = 0, wines = 0;
  const byType = {}, byCountry = {}, byStatus = {};
  let external = 0, wishlist = 0, archived = 0;
  for (const w of state.wines) {
    if (w.origin === 'extern') { external++; if (w.wishlist) wishlist++; continue; }
    if (w.wishlist) wishlist++;
    const q = quantity(w);
    if (q <= 0) { archived++; continue; }
    wines++; bottles += q;
    if (w.price != null) value += q * w.price; else unpriced += q;
    byType[WINE_TYPES[w.type]] = (byType[WINE_TYPES[w.type]] || 0) + q;
    const c = w.country || 'ohne Land';
    byCountry[c] = (byCountry[c] || 0) + q;
    const st = maturity(w, year).key;
    byStatus[st] = (byStatus[st] || 0) + q;
  }
  return { bottles, value, unpriced, wines, byType, byCountry, byStatus, archived, external, wishlist };
}

/** Werte für Autovervollständigung */
function suggestions(state) {
  const set = k => new Set();
  const out = { producer: set(), country: set(), region: set(), appellation: set(), grapes: set(), source: set(), tags: set(), classification: set(), externalPlace: set() };
  for (const w of state.wines) {
    ['producer', 'country', 'region', 'appellation', 'source', 'classification', 'externalPlace'].forEach(k => w[k] && out[k].add(w[k]));
    (w.grapes || []).forEach(g => out.grapes.add(g));
    (w.tags || []).forEach(t => out.tags.add(t));
  }
  ['Deutschland', 'Frankreich', 'Italien', 'Spanien', 'Österreich', 'Portugal'].forEach(c => out.country.add(c));
  ['VDP.Gutswein', 'VDP.Ortswein', 'VDP.Erste Lage', 'VDP.GG', 'DOC', 'DOCG', 'AOC', 'Grand Cru', 'Premier Cru', 'Reserva', 'Gran Reserva', 'Kabinett', 'Spätlese', 'Auslese'].forEach(c => out.classification.add(c));
  return Object.fromEntries(Object.entries(out).map(([k, v]) => [k, [...v].sort((a, b) => a.localeCompare(b, 'de'))]));
}

/* =========================================================================
   6. LOGIC – Vivino
   Vivino bietet KEINE offizielle Schnittstelle (API). Automatischer Abruf
   ginge nur über undokumentierte interne Endpunkte – die können sich jederzeit
   ändern, werden vom Browser meist blockiert (CORS) und würden deine
   Weinnamen an Vivino senden. Darum: Bewertung manuell eintragen, die App
   öffnet dafür nur die passende Vivino-Suche in einem neuen Tab.
   ========================================================================= */
function vivinoSearchUrl(w) {
  const q = [w.producer, w.name, Number.isInteger(w.vintage) ? w.vintage : ''].filter(Boolean).join(' ').replace(/^Demo:\s*/i, '');
  return 'https://www.vivino.com/search/wines?q=' + encodeURIComponent(q);
}

/* =========================================================================
   6. LOGIC – Export / Import
   ========================================================================= */
function exportJSON(state) {
  const out = deepClone(state);
  out.exportedAt = new Date().toISOString();
  return JSON.stringify(out, null, 2);
}

/** Liest eine JSON-Datei, migriert und prüft sie. Wirft Error mit deutscher Meldung. */
function parseImportJSON(text) {
  let data;
  try { data = JSON.parse(text); }
  catch { throw new Error('Die Datei ist kein gültiges JSON. Ist sie beschädigt oder unvollständig?'); }
  if (Array.isArray(data)) throw new Error('Unbekanntes Format: erwartet wird ein Weinkeller-Backup (Objekt mit „schemaVersion“).');
  if (data.app && data.app !== APP_ID) throw new Error(`Die Datei gehört zu einer anderen App („${data.app}“).`);
  const s = migrate(data);
  const errs = validateState(s);
  if (errs.length) {
    const e = new Error('Die Datei enthält fehlerhafte Einträge:');
    e.details = errs.slice(0, 20);
    if (errs.length > 20) e.details.push(`… und ${errs.length - 20} weitere.`);
    throw e;
  }
  delete s.exportedAt;
  return s;
}

/** Zusammenführen: gleiche ID → neuere Änderung gewinnt; neue Lagerorte werden ergänzt */
function mergeStates(cur, inc) {
  const res = deepClone(cur);
  const byId = new Map(res.wines.map(w => [w.id, w]));
  let added = 0, updated = 0;
  for (const w of inc.wines) {
    const ex = byId.get(w.id);
    if (!ex) { res.wines.push(w); added++; }
    else if (String(w.updatedAt) > String(ex.updatedAt)) { Object.assign(ex, w); updated++; }
  }
  for (const l of inc.locations) {
    const ex = res.locations.find(x => x.id === l.id);
    if (!ex) res.locations.push(l);
    else l.zones.forEach(z => { if (!ex.zones.find(y => y.id === z.id)) ex.zones.push(z); });
  }
  return { state: res, added, updated };
}

/** CSV-Spalten: [Kopfzeile, Wert-Funktion]. Semikolon + BOM = öffnet sauber in Excel (de) und Numbers. */
const CSV_COLUMNS = [
  ['ID', w => w.id], ['Name', w => w.name], ['Weingut', w => w.producer], ['Jahrgang', w => w.vintage ?? ''],
  ['Typ', w => WINE_TYPES[w.type]], ['Rebsorten', w => (w.grapes || []).join(', ')], ['Land', w => w.country],
  ['Region', w => w.region], ['Lage/Appellation', w => w.appellation], ['Qualitätsstufe', w => w.classification],
  ['Flaschengröße (l)', w => w.bottleSize != null ? fmtNum.format(w.bottleSize) : ''], ['Alkohol (%)', w => w.abv != null ? fmtNum.format(w.abv) : ''],
  ['Menge', w => quantity(w)], ['Lagerorte', (w, s) => (w.placements || []).filter(p => p.count > 0).map(p => `${placementLabel(s, p)} (${p.count})`).join(' | ')],
  ['Trinkreif ab', w => w.drinkFrom ?? ''], ['Höhepunkt', w => w.peak ?? ''], ['Trinken bis', w => w.drinkUntil ?? ''],
  ['Status', (w, s) => { const m = maturity(w); return m.label + (m.window.estimated !== 'none' && !['leer', 'extern'].includes(m.key) ? ' (Schätzung)' : ''); }],
  ['Kaufdatum', w => w.purchaseDate], ['Bezugsquelle', w => w.source], ['Preis/Flasche (€)', w => w.price != null ? fmtNum.format(w.price) : ''],
  ['Speiseempfehlung', w => w.food], ['Serviertemperatur', w => w.servingTemp], ['Dekantieren', w => w.decant],
  ['Herkunft', w => w.origin === 'extern' ? 'extern getrunken' : 'Keller'], ['Wo getrunken', w => w.externalPlace], ['Nachkaufen', w => w.wishlist ? 'ja' : ''],
  ['Bewertung (1–5)', w => w.rating ?? ''], ['Vivino', w => w.vivinoRating != null ? fmtNum.format(w.vivinoRating) : ''], ['Vivino-Link', w => w.vivinoUrl], ['Externe Bewertungen', w => w.externalRatings], ['Notizen', w => w.notes], ['Tags', w => (w.tags || []).join(', ')]
];
function csvCell(v) { const s = String(v ?? ''); return /[;"\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; }
function exportCSV(state) {
  const lines = [CSV_COLUMNS.map(c => c[0]).join(';')];
  for (const w of state.wines) lines.push(CSV_COLUMNS.map(c => csvCell(c[1](w, state))).join(';'));
  return '﻿' + lines.join('\r\n');
}

/** Einfacher CSV-Parser (Anführungszeichen, ; oder , als Trenner) */
function parseCSV(text) {
  text = text.replace(/^﻿/, '');
  const first = text.split(/\r?\n/)[0] || '';
  const sep = (first.match(/;/g) || []).length >= (first.match(/,/g) || []).length ? ';' : ',';
  const rows = []; let row = [], cell = '', inQ = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQ) {
      if (c === '"' && text[i + 1] === '"') { cell += '"'; i++; }
      else if (c === '"') inQ = false;
      else cell += c;
    } else if (c === '"') inQ = true;
    else if (c === sep) { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += c;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim() !== ''));
}

/**
 * CSV-Import: legt NEUE Weine an (Lagerplätze werden nicht übernommen, die
 * Menge wird als Zugang gebucht und erscheint als „ohne Platz“).
 * Liefert {wines, errors}.
 */
function importCSV(text, state) {
  const rows = parseCSV(text);
  if (rows.length < 2) throw new Error('Die CSV-Datei enthält keine Datenzeilen.');
  const head = rows[0].map(h => norm(h.trim()));
  const col = name => head.indexOf(norm(name));
  if (col('Name') < 0 || col('Weingut') < 0) throw new Error('Die CSV braucht mindestens die Spalten „Name“ und „Weingut“ (Kopfzeile wie beim Export).');
  const typeByLabel = Object.fromEntries(Object.entries(WINE_TYPES).map(([k, v]) => [norm(v), k]));
  const wines = [], errors = [];
  rows.slice(1).forEach((r, i) => {
    const g = name => { const c = col(name); return c >= 0 ? (r[c] ?? '').trim() : ''; };
    const w = emptyWine();
    w.name = g('Name'); w.producer = g('Weingut');
    const v = g('Jahrgang'); w.vintage = /^nv$/i.test(v) ? 'NV' : toInt(v);
    w.type = typeByLabel[norm(g('Typ'))] || 'rot';
    w.grapes = splitList(g('Rebsorten')); w.country = g('Land'); w.region = g('Region');
    w.appellation = g('Lage/Appellation'); w.classification = g('Qualitätsstufe');
    w.bottleSize = toNum(g('Flaschengröße (l)')) ?? 0.75; w.abv = toNum(g('Alkohol (%)'));
    w.drinkFrom = toInt(g('Trinkreif ab')); w.peak = toInt(g('Höhepunkt')); w.drinkUntil = toInt(g('Trinken bis'));
    w.purchaseDate = /^\d{4}-\d{2}-\d{2}$/.test(g('Kaufdatum')) ? g('Kaufdatum') : (/^\d{2}\.\d{2}\.\d{4}$/.test(g('Kaufdatum')) ? g('Kaufdatum').split('.').reverse().join('-') : '');
    w.source = g('Bezugsquelle'); w.price = toNum(g('Preis/Flasche (€)'));
    w.food = g('Speiseempfehlung'); w.servingTemp = g('Serviertemperatur'); w.decant = g('Dekantieren');
    w.rating = toInt(g('Bewertung (1–5)')); w.vivinoRating = toNum(g('Vivino')); w.vivinoUrl = g('Vivino-Link');
    w.origin = /extern/i.test(g('Herkunft')) ? 'extern' : 'keller'; w.externalPlace = g('Wo getrunken'); w.wishlist = /^(ja|x|1|true)$/i.test(g('Nachkaufen')); w.externalRatings = g('Externe Bewertungen'); w.notes = g('Notizen'); w.tags = splitList(g('Tags'));
    const qty = toInt(g('Menge'));
    if (w.origin === 'keller' && qty != null && !Number.isNaN(qty) && qty > 0) w.movements.push({ id: uuid(), date: w.purchaseDate || todayISO(), kind: 'kauf', qty, note: 'CSV-Import' });
    if (qty != null && (Number.isNaN(qty) || qty < 0)) { errors.push(`Zeile ${i + 2}: Menge „${g('Menge')}“ ist ungültig.`); return; }
    const res = validateWine(w, state);
    if (!res.ok) errors.push(`Zeile ${i + 2} („${w.name || '–'}“): ${Object.values(res.errors).join(' ')}`);
    else wines.push(w);
  });
  return { wines, errors };
}

/* =========================================================================
   DEMO-DATEN – 12 Beispielweine (davon 2 „woanders getrunken“), alle mit isDemo:true.
   Mit „Demo-Daten löschen“ (Daten & Backup) werden genau diese entfernt.
   Trinkfenster sind relativ zum aktuellen Jahr gewählt, damit jeder
   Ampel-Status vorkommt – egal, wann du die App startest.
   ========================================================================= */

  const d = (yOff, md) => `${Y + yOff}-${md}`;

      food: 'Schmorgerichte, Wild, Trüffelrisotto, gereifter Hartkäse', servingTemp: '17–18 °C', decant: '2 Stunden dekantieren', externalRatings: 'Falstaff 94', vivinoRating: 4.2,
      placements: [P(keller, kz, 1, 1, 3)], movements: [buy(3, d(-3, '03-14'))], tags: ['besonderer Anlass'] }),

      abv: 13.5, drinkFrom: Y - 6, peak: Y - 1, drinkUntil: Y + 4, purchaseDate: d(-10, '11-02'), source: 'Subskription', price: 65,
      food: 'Lammrücken, Rinderfilet, Entrecôte', servingTemp: '17–18 °C', decant: '1 Stunde, Depot beachten', rating: 5,
      placements: [P(keller, kz, 1, 2, 1), P(keller, kz, 1, 3, 1)], movements: [buy(4, d(-10, '11-02')), out('getrunken', 2, d(-1, '12-24'), 'Weihnachten – großartig')],

/* =========================================================================
   7. STORE – Zustand + Speichern. Die UI ändert Daten nur über commit().
   ========================================================================= */
const Store = {
  state: null,
  storage: null,
  persisted: null,      // true/false/null (unbekannt)
  lostDataWarning: false,

  async init() {
    try { this.storage = await createStorage(); }
    catch { this.storage = new LocalStorageStorage(); }
    let raw = null;
    try { raw = await this.storage.load(); } catch (e) { console.error(e); }
    if (raw) {
      try { this.state = migrate(raw); }
      catch (e) { console.error(e); this.state = emptyState(); this.loadError = e.message; }
    } else {
      this.state = emptyState();
      const m = Marker.get();
      if (m && m.count > 0) this.lostDataWarning = m;   // es GAB Daten, jetzt sind sie weg
    }
    if (navigator.storage && navigator.storage.persisted) {
      try { this.persisted = await navigator.storage.persisted(); } catch {}
    }
  },

  /** Ändert den Zustand über eine Funktion und speichert. Gibt true/false zurück. */
  async commit(mutator) {
    const before = JSON.stringify(this.state);
    try {
      mutator(this.state);
      await this.storage.save(this.state);
      Marker.set(this.state.wines.length);
      this.lostDataWarning = false;
      this.requestPersistence();
      return true;
    } catch (e) {
      this.state = JSON.parse(before);      // Rückrollen, damit Anzeige = Gespeichertes
      UI.toast('Speichern fehlgeschlagen: ' + e.message);
      return false;
    }
  },

  /** Bittet den Browser, die Daten nicht automatisch zu löschen */
  async requestPersistence() {
    if (this.persisted || !navigator.storage || !navigator.storage.persist) return;
    try { this.persisted = await navigator.storage.persist(); } catch {}
  },

  wine(id) { return this.state.wines.find(w => w.id === id); }
};

};
const MONTHS = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];
const monthYear = () => { const d = new Date(); return `${MONTHS[d.getMonth()]} ${d.getFullYear()}`; };

const UI = {
  filter: { scope: 'bestand', q: '', types: [], statuses: [], country: '', region: '', grape: '', locationId: '', priceMin: '', priceMax: '', vintageMin: '', vintageMax: '', food: '', wishlist: false },
  sort: 'urgency',
  filterOpen: false,
  planZone: null,          // "locId|zoneId" für die Lagerplan-Ansicht
  toastTimer: null,

  /* ---------- kleine Bausteine ---------- */
  badge(m, small = false) {
    const est = !['leer', 'extern'].includes(m.key) && m.window.estimated !== 'none' ? ` <span class="est">(${m.window.estimated === 'full' ? 'Schätzung' : 'teils geschätzt'})</span>` : '';
    return `<span class="badge st-${m.key}">${esc(m.label)}${small ? '' : est}</span>`;
  },
  stars(n) { return n ? `<span class="stars" aria-label="${n} von 5 Sternen">${'★'.repeat(n)}${'☆'.repeat(5 - n)}</span>` : ''; },
  vintage(w) { return w.vintage === 'NV' ? 'NV' : (w.vintage ?? '–'); },
  vivino(w) { return w.vivinoRating != null ? `<span class="vivino" title="Vivino-Community-Bewertung">Vivino ${fmtNum.format(w.vivinoRating)}</span>` : ''; },
  starGroup(w, idSuffix) {
    return `<div class="star-input" role="group" aria-labelledby="rating-l${idSuffix}">${[1, 2, 3, 4, 5].map(n => `<button type="button" data-act="star" data-n="${n}" aria-pressed="${(w.rating || 0) >= n}" aria-label="${n} Stern${n > 1 ? 'e' : ''}">★</button>`).join('')}
        <button type="button" data-act="star" data-n="0" class="sm" style="font-size:.85rem;color:var(--text-2)">keine</button></div>`;
  },
  mainPlace(w, s) {
    const p = (w.placements || []).find(p => p.count > 0);
    if (!p) return quantity(w) > 0 ? 'ohne festen Platz' : '';
    const more = w.placements.filter(p => p.count > 0).length - 1;
    // kurz für Karten: „Kühlschrank R2/F2“ (Regalname nur, wenn das Lager mehrere hat)
    const l = findLocation(s, p.locationId), z = l && l.zones.find(z => z.id === p.zoneId);
    const where = l ? (l.zones.length > 1 && z ? `${l.name} · ${z.name}` : l.name) : '?';
    const pos = p.row && p.col ? ` R${p.row}/F${p.col}` : p.row ? ` R${p.row}` : '';
    return where + pos + (more > 0 ? ` +${more}` : '');
  },
  /** Kurze Statusbezeichnung für Karten */
  shortLabel(m) {
    if (m.key !== 'bald') return m.label;
    const y = currentYear(), win = m.window;
    return win.peak != null && y >= win.peak && win.drinkUntil - y > 1 ? 'Höhepunkt' : 'Bald trinken';
  },
  /** Weinkarte im Layout „Weinfarben“: Farbstreifen + Jahrgang in der Typfarbe */
  wineCard(w) {
    const s = Store.state, m = maturity(w), q = quantity(w), v = this.vintage(w);
    const head = `<span class="stripe" aria-hidden="true"></span>
      <span class="vint ${v === 'NV' ? 'nv' : ''}" aria-hidden="true">${esc(v)}</span>`;
    const title = `<a class="title" href="#/wein/${w.id}">${esc(w.name)}<span class="sr-only"> ${esc(v)}</span></a>`;
    if (w.origin === 'extern') return `<article class="wine ty-${w.type} s-extern">${head}
      <div class="info">${title}
        <div class="meta prod">${esc(w.producer)}${w.externalPlace ? ' · ' + esc(w.externalPlace) : ''}</div>
        <div class="meta">${this.badge(m)} ${this.stars(w.rating)} ${this.vivino(w)} ${w.wishlist ? '<span class="badge st-wish">Nachkaufen</span>' : ''}</div>
      </div><div></div>
    </article>`;
    const est = !['leer'].includes(m.key) && m.window.estimated === 'full' ? ' <span class="est">(geschätzt)</span>' : '';
    return `<article class="wine ty-${w.type} s-${m.key}">${head}
      <div class="info">${title}
        <div class="meta prod">${esc(w.producer)}${w.region ? ' · ' + esc(w.region) : ''}</div>
        <div class="meta"><span class="badge st-${m.key}">${esc(this.shortLabel(m))}${est}</span>
          ${q > 0 ? `<span class="pin">${ICON.pin}${esc(this.mainPlace(w, s))}</span>` : ''} ${this.vivino(w)}</div>
      </div>
      <div class="qty">
        <span class="n" aria-label="${q} Flaschen">${q}<small aria-hidden="true">Fl.</small></span>
        ${q > 0 ? `<button class="minus" data-act="quick" data-id="${w.id}" aria-label="Eine Flasche ${esc(w.name)} ${esc(v)} als getrunken abbuchen" title="1 Flasche getrunken">−1</button>` : ''}
      </div>
    </article>`;
  },
  datalists() {
    const sg = suggestions(Store.state);
    return Object.entries(sg).map(([k, vals]) => `<datalist id="dl-${k}">${vals.map(v => `<option value="${esc(v)}">`).join('')}</datalist>`).join('');
  },
  zoneOptions(selLoc, selZone, withEmpty = false) {
    const opts = [];
    if (withEmpty) opts.push(`<option value="">– kein Platz –</option>`);
    for (const l of Store.state.locations) for (const z of l.zones)
      opts.push(`<option value="${l.id}|${z.id}" ${l.id === selLoc && z.id === selZone ? 'selected' : ''}>${esc(l.name)} › ${esc(z.name)}</option>`);
    return opts.join('');
  },

  /* ---------- Rückmeldungen ---------- */
  toast(text, action) {
    clearTimeout(this.toastTimer);
    $$('.toast').forEach(t => t.remove());
    const t = document.createElement('div');
    t.className = 'toast'; t.setAttribute('role', 'status');
    t.innerHTML = `<span>${esc(text)}</span>${action ? `<button type="button">${esc(action.label)}</button>` : ''}`;
    if (action) t.querySelector('button').onclick = () => { t.remove(); action.fn(); };
    document.body.appendChild(t);
    $('#live').textContent = text;
    this.toastTimer = setTimeout(() => t.remove(), action ? 7000 : 3500);
  },
  /** Eigener Bestätigungsdialog (blockiert nicht wie confirm()) */
  dialog({ title, html = '', buttons }) {
    return new Promise(res => {
      const d = $('#dlg');
      d.innerHTML = `<h2 style="margin-top:0">${esc(title)}</h2><div>${html}</div><div class="actions">${buttons.map((b, i) =>
        `<button type="button" data-i="${i}" class="${b.cls || ''}">${esc(b.label)}</button>`).join('')}</div>`;
      d.onclick = e => { const b = e.target.closest('button[data-i]'); if (b) { d.close(); res(buttons[+b.dataset.i].value); } };
      d.oncancel = () => res(null);
      d.showModal();
      const prim = d.querySelector('button.primary, button.danger'); (prim || d.querySelector('button')).focus();
    });
  },
  confirm(title, text, okLabel = 'OK', danger = false) {
    return this.dialog({ title, html: `<p>${esc(text)}</p>`, buttons: [{ label: 'Abbrechen', value: false }, { label: okLabel, value: true, cls: danger ? 'danger' : 'primary' }] });
  },
  download(name, text, mime) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type: mime }));
    a.download = name; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  },

  /* ---------- Schnell-Entnahme (1 Tap) mit Rückgängig ---------- */
  async quickWithdraw(id) {
    const w = Store.wine(id); if (!w) return;
    const snap = deepClone(w.placements);
    let err = null, movId = null, from = '';
    const ok = await Store.commit(s => {
      const x = s.wines.find(x => x.id === id);
      err = applyMovement(x, { kind: 'getrunken', qty: 1 });
      if (err) return;
      const mv = x.movements[x.movements.length - 1]; movId = mv.id;
      const p = x.placements.find(p => p.id === mv.placementId);
      if (p) from = ' aus ' + placementLabel(s, p, true);
    });
    if (err) return this.toast(err);
    if (!ok) return;
    render();
    this.toast(`1 × ${w.name} getrunken${from}. Prost!`, { label: 'Rückgängig', fn: async () => {
      await Store.commit(s => undoMovement(s.wines.find(x => x.id === id), movId, snap));
      render(); this.toast('Entnahme rückgängig gemacht.');
    } });
  }
};

/** Belegung einer Zone: {cells:{"r-c":[{w,p}]}, loose:[{w,p}], free} */
function zoneOccupancy(s, locId, zoneId) {
  const cells = {}, loose = [];
  for (const w of s.wines) {
    if (w.origin === 'extern' || quantity(w) <= 0) continue;
    for (const p of w.placements) {
      if (p.count <= 0 || p.locationId !== locId || p.zoneId !== zoneId) continue;
      if (p.row && p.col) (cells[`${p.row}-${p.col}`] ||= []).push({ w, p });
      else loose.push({ w, p });
    }
  }
  const z = findZone(s, locId, zoneId);
  const used = Object.keys(cells).filter(k => { const [r, c] = k.split('-').map(Number); return r <= z.rows && c <= z.cols; }).length;
  return { cells, loose, free: z.rows * z.cols - used };
}

/** Kurzansicht aller Regale (Layout A): Punkteraster + freie Fächer */
function planTeaser() {
  const s = Store.state;
  const rows = s.locations.flatMap(l => l.zones.map(z => {
    const occ = zoneOccupancy(s, l.id, z.id);
    const R = Math.min(z.rows, 8), C = Math.min(z.cols, 10);
    let dots = '';
    for (let r = 1; r <= R; r++) for (let c = 1; c <= C; c++) {
      const it = occ.cells[`${r}-${c}`];
      dots += it ? `<i class="o s-${it.map(x => maturity(x.w)).sort((a, b) => b.score - a.score)[0].key}"></i>` : '<i></i>';
    }
    return `<a class="zrow" href="#/lagerplan" data-act="plan-zone" data-zone="${l.id}|${z.id}">
      <span class="mg-box" aria-hidden="true"><span class="minigrid" style="grid-template-columns:repeat(${C}, 9px)">${dots}</span></span>
      <span style="flex:1;display:flex;flex-direction:column;gap:.1rem"><span class="zname">${esc(l.name)} · ${esc(z.name)}</span>
      <span class="small muted">${occ.free} von ${z.rows * z.cols} Fächern frei${occ.loose.length ? ` · ${occ.loose.reduce((a, x) => a + x.p.count, 0)} ohne Fach` : ''}</span></span>
      <span class="go">Plan</span></a>`;
  }));
  return rows.length ? `<div class="plan-teaser">${rows.join('')}</div>` : '<p class="small">Noch keine Lagerorte. <a href="#/daten">Lagerorte anlegen</a></p>';
}

/** Volle Lagerplan-Seite */
